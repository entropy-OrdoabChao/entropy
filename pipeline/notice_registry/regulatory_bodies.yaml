notice_templates:
  party_courtesy_decline: 'RE: {subject}


    This matter is handled through an automated, self-operated system by which I,
    {name}, proceeding

    pro se, prepare my own filings and submit them to the Court by mail; I am not
    a registered e-filer.

    I monitor the docket directly and am served in the manner required by Fed. R.
    Civ. P. 5. Emailed

    courtesy copies are unnecessary, are not required, and are not accepted as a substitute
    for service

    of record — formal service must be made as the rule provides. You may save the
    effort of emailing

    courtesy copies.


    I am preserving this correspondence and reserve all rights. — {name}

    '
  party_opposing_counsel: 'RE: {subject}

    I, {name}, proceed in this matter on my own behalf (sui juris) and monitor
    the docket directly. I acknowledge your correspondence and respond as
    follows.

    1. I preserve this correspondence and reserve all rights, defenses, and
    remedies, without waiving anything by this reply.
    2. Provide, in writing within thirty (30) days, the complete basis for any
    demand or position asserted in your letter, with the full supporting file
    and itemization.
    3. Cease any adverse action or adverse reporting pending that accounting.

    I am preserving this correspondence and reserve all rights and remedies.
    — {name}

    '
  party_records_dispute_noconsent: "RE: {subject}\n\nThis is a written dispute and\
    \ a request for records under my consumer rights. Regarding {party}:\n\n1. I DISPUTE\
    \ the amount asserted. My insurance on file covers the service(s) at issue; provide\
    \ the\n   specific basis for any patient balance, including the exact service\
    \ billed and the reason it is\n   not covered.\n2. Within thirty (30) days, provide\
    \ a FULL ITEMIZED ACCOUNTING of all charges, payments, insurance\n   submissions,\
    \ and adjustments on my account. I previously requested this accounting and did\
    \ not\n   receive a usable copy; please re-send it in writing.\n3. I DO NOT CONSENT\
    \ to any crown, or to any additional procedure beyond the covered cleaning. Do\
    \ not\n   bill for services not rendered or not consented to.\n4. Provide a complete\
    \ copy of my treatment records, including any note asserting that treatment was\n\
    \   \"not finished.\"\n\nPlease respond in writing. I am preserving this correspondence.\
    \ — {name}\n"
  party_dispute_validation: "RE: {subject}\n\nThis is a written dispute and demand\
    \ for validation. Regarding {party}:\n\n1. I DISPUTE the amount and request full\
    \ validation/itemization of the obligation, including its\n   origin, the amount,\
    \ and your authority to assert it.\n2. Provide all supporting documentation in\
    \ writing within thirty (30) days.\n3. Cease any adverse reporting or collection\
    \ of the disputed amount until it is validated.\n\nI am preserving this correspondence\
    \ and reserve all rights and remedies. — {name}\n"
  regulatory_complaint: 'TO: {regulator}

    RE: Regulatory complaint concerning {party}


    Under {authority}, I submit this complaint. {regulator} oversees {oversees}.


    Summary of the conduct (facts on the record below):

    {asks}


    I request that the {regulator} open an inquiry and take the action within its
    authority. I have

    also noticed the party directly. I will supplement with documentation as it is
    gathered.


    Respectfully, {name}

    [Attach: the party correspondence + any itemized accounting / records received.]

    '
reply_directives:
  opposing_counsel:
    law: 42 Pa.C.S. ch. 55 (Limitations of Action — the limitations clock is running)
    points:
    - Acknowledge receipt; proceed sui juris and monitor the docket directly.
    - Preserve this correspondence; reserve all rights, defenses, and remedies — no waiver by this reply.
    - Demand the complete written basis + full supporting file for any demand, within 30 days.
    - Cease any adverse action or reporting pending that accounting.
    must_include:
    - reserve
  dental:
    law: 73 P.S. § 201-1 et seq. (PA UTPCPL); my right to an itemized accounting
    points:
    - Dispute the balance — insurance on file covers the cleaning.
    - Demand an itemized accounting within 30 days.
    - Withhold consent to any crown or uncovered procedure.
    must_include:
    - dispute
  medical:
    law: 73 P.S. § 201-1 (PA UTPCPL)
    points:
    - Dispute the balance given the insurance on file; demand an itemized accounting
      and records within 30 days.
    must_include:
    - dispute
  debt_collection:
    law: 15 U.S.C. § 1692g (FDCPA — validation)
    points:
    - Dispute the debt and demand validation within 30 days.
    - Cease collection and adverse reporting until it is validated.
    must_include:
    - dispute
  insurance:
    law: 42 Pa.C.S. § 8371; 40 P.S. § 1171 (UIPA)
    points:
    - Dispute the denial; demand the claim file and the basis under the policy within
      30 days.
    must_include:
    - dispute
  credit_reporting:
    law: 15 U.S.C. § 1681i (FCRA — reinvestigation)
    points:
    - Dispute the item; demand a reinvestigation and the method of verification.
    must_include:
    - dispute
  bank_creditor:
    law: 15 U.S.C. § 1666 (FCBA — billing error)
    points:
    - Assert a billing-error dispute; demand investigation and correction.
    must_include:
    - dispute
