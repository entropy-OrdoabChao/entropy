  # DRAFT-ONLY LANE (card t_7bc9ce71): opposing-counsel / lawyer correspondence.
  # Classify + draft (m0, deterministic validator as gate); NEVER auto-send. Drafts are staged in
  # output/email_replies/ as DRAFT cards (reply lane) for user approval and ship only after human
  # go via pipeline/send_reply.py (allowlist gate).
  # Markers are attorney-speak (recall over precision — over-capture lands in the
  # human-reviewed draft lane, never an auto-send; under-capture keeps old behavior).
  opposing_counsel:
    match:
    - on behalf of our client
    - our client
    - attorney at law
    - attorney for
    - attorneys for
    - attorney of record
    - law office
    - law firm
    - legal team
