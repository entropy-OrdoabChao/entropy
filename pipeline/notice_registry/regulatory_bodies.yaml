        12 U.S.C. § 5481 et seq.
      oversees: debt collectors; false/misleading representations, unfair practices,
        failure to validate
      where: CFPB, P.O. Box 27170, Washington, DC 20038 (consumerfinance.gov/complaint)
      procedure: 'Consumer complaint re: FDCPA violation; CFPB forwards to the collector
        for response.'
    - body: Pennsylvania Office of Attorney General — Bureau of Consumer Protection
      authority: PA Fair Credit Extension Uniformity Act, 73 P.S. § 2270.1; UTPCPL,
        73 P.S. § 201-1
      oversees: unfair/deceptive collection practices against PA consumers
      where: Bureau of Consumer Protection, 15th Floor, Strawberry Square, Harrisburg,
        PA 17120
      procedure: Consumer-protection complaint; the AG may investigate and enforce.
