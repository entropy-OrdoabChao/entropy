# ═══════════════════════════════════════════════════════════════════════════
#  TEMPORAL RULES CATALOG v2 — Beezle pro se litigation engine
#  v2 changes from v1:
#    + party_role field added (plaintiff | defendant | either) — filters which
#      rules apply to a user's posture
#    + maps_to field added — declares which case-anchor fields satisfy this
#      rule's trigger, decoupling rule definitions from engine TRIGGER_MAP
#
#  Schema per rule:
#    id:           snake_case unique identifier
#    citation:     authoritative rule citation
#    name:         short human-readable label
#    description:  one-sentence summary
#    days:         integer day count (null = "reasonable time")
#    unit:         'calendar' | 'business'
#    counting:     'FRCP_6a' | 'FRAP_26a' | 'PA_106' | 'literal'
#    trigger:      semantic event name (preserved for documentation)
#    maps_to:      list of case-anchor field names that activate this rule
#                  (e.g. ['entry_of_judgment'], ['filed', 'latest_order'])
#                  If empty/missing, engine uses TRIGGER_MAP fallback.
#    party_role:   'plaintiff' | 'defendant' | 'either'
#                  Plaintiff Filer: only show rules applicable to plaintiff
#                  or either. Skip defendant-only rules entirely.
#    forum:        'federal_trial' | 'federal_appellate' | 'scotus' | 'tax_court'
#                  | 'pa_trial' | 'pa_superior' | 'pa_commonwealth' | 'pa_supreme'
#    waivable:     true | false
#    jurisdictional: true | false
#    notes:        free-text caveats
# ═══════════════════════════════════════════════════════════════════════════

version: "2.0"
last_updated: "2026-05-29"

rules:

# ──────────────────────────────────────────────────────────────────────────
# FEDERAL TRIAL COURT — FRCP
# ──────────────────────────────────────────────────────────────────────────

  - id: frcp_12_response
    citation: "FRCP 12(a)(1)(A)(i)"
    name: "Answer / Rule 12 motion"
    description: "Defendant's answer or pre-answer motion after service."
    days: 21
    unit: calendar
    counting: FRCP_6a
    trigger: service_of_complaint
    maps_to: []  # defendant-only — won't fire for plaintiff
    party_role: defendant
    forum: federal_trial
    waivable: true
    jurisdictional: false
    requires_state: [pre_judgment, pre_judgment_removal_pending, trial_in_progress]

  - id: frcp_12_response_waived_service
    citation: "FRCP 12(a)(1)(A)(ii)"
    name: "Answer after waived service"
    description: "60 days if service formally waived under Rule 4(d)."
    days: 60
    unit: calendar
    counting: FRCP_6a
    trigger: waiver_of_service_sent
    maps_to: []
    party_role: defendant
    forum: federal_trial
    waivable: true
    jurisdictional: false
    requires_state: [pre_judgment, pre_judgment_removal_pending, trial_in_progress]

  - id: frcp_15_amend_once
    citation: "FRCP 15(a)(1)"
    name: "Amend pleading as of right"
    description: "Amend once within 21 days of service or service of responsive pleading."
    days: 21
    unit: calendar
    counting: FRCP_6a
    trigger: service_of_complaint
    maps_to: []  # Plaintiff is past this; suppress noise
    party_role: either
    forum: federal_trial
    waivable: false
    jurisdictional: false
    notes: "21 days post-filing; engine suppresses unless within first 30 days of filing."
    requires_state: [pre_judgment, pre_judgment_removal_pending, trial_in_progress]

  - id: frcp_15_amend_court_leave
    citation: "FRCP 15(a)(2)"
    name: "Amend with court leave"
    description: "After Rule 15(a)(1) expires; court should freely grant when justice requires."
    days: null
    unit: calendar
    counting: FRCP_6a
    trigger: any
    maps_to: [latest_order]
    party_role: either
    forum: federal_trial
    waivable: false
    jurisdictional: false
    requires_state: [pre_judgment, pre_judgment_removal_pending, trial_in_progress]

  - id: frcp_50_renewed_jmol
    citation: "FRCP 50(b)"
    name: "Renewed JMOL after jury verdict"
    description: "Motion for judgment as matter of law after verdict."
    days: 28
    unit: calendar
    counting: FRCP_6a
    trigger: entry_of_judgment
    maps_to: [entry_of_judgment]
    party_role: either
    forum: federal_trial
    waivable: false
    jurisdictional: false
    notes: "Hard 28-day limit; not extendable by Rule 6(b)."
    requires_state: [trial_in_progress, post_judgment_total, post_dismissal_partial]

  - id: frcp_52b_amend_findings
    citation: "FRCP 52(b)"
    name: "Amend findings of fact"
    description: "Motion to amend court's findings after bench trial."
    days: 28
    unit: calendar
    counting: FRCP_6a
    trigger: entry_of_judgment
    maps_to: [entry_of_judgment]
    party_role: either
    forum: federal_trial
    waivable: false
    jurisdictional: false
    requires_state: [post_judgment_total, post_dismissal_partial]

  - id: frcp_54b_certification
    citation: "FRCP 54(b)"
    name: "Rule 54(b) certification"
    description: "Direct entry of final judgment as to fewer than all claims/parties."
    days: null
    unit: calendar
    counting: FRCP_6a
    trigger: any
    maps_to: [entry_of_judgment, latest_order]
    party_role: either
    forum: federal_trial
    waivable: false
    jurisdictional: false
    notes: "No fixed deadline. Filed at discretion to unlock interlocutory appeal."
    requires_state: [post_dismissal_partial]

  - id: frcp_59a_new_trial
    citation: "FRCP 59(b)"
    name: "New trial motion"
    description: "Motion for new trial after judgment."
    days: 28
    unit: calendar
    counting: FRCP_6a
    trigger: entry_of_judgment
    maps_to: [entry_of_judgment]
    party_role: either
    forum: federal_trial
    waivable: false
    jurisdictional: true
    notes: "Hard 28-day limit; CANNOT be extended (Rule 6(b)(2))."
    requires_state: [post_judgment_total, post_dismissal_partial]

  - id: frcp_59e_alter_amend
    citation: "FRCP 59(e)"
    name: "Motion to alter or amend judgment"
    description: "Reconsideration of final judgment under manifest error / new evidence / clear injustice."
    days: 28
    unit: calendar
    counting: FRCP_6a
    trigger: entry_of_judgment
    maps_to: [entry_of_judgment]
    party_role: either
    forum: federal_trial
    waivable: false
    jurisdictional: true
    notes: "Hard 28-day limit; not extendable. Tolls FRAP 4(a) appeal clock."
    requires_state: [post_judgment_total, post_dismissal_partial]

  - id: frcp_60b_1to3
    citation: "FRCP 60(b)(1)-(3)"
    name: "Relief from judgment: mistake/evidence/fraud"
    description: "Relief for mistake (1), newly discovered evidence (2), fraud or misrepresentation (3)."
    days: 365
    unit: calendar
    counting: FRCP_6a
    trigger: entry_of_judgment
    maps_to: [entry_of_judgment]
    party_role: either
    forum: federal_trial
    waivable: false
    jurisdictional: false
    notes: "1-year outer limit; must also be filed within 'reasonable time'."
    requires_state: [post_judgment_total, post_dismissal_partial, post_judgment_appealed, appeal_decided]

  - id: frcp_60b_4to6
    citation: "FRCP 60(b)(4)-(6)"
    name: "Relief from judgment: void/satisfied/other"
    description: "Void judgment (4), satisfied/released (5), other reason justifying relief (6)."
    days: null
    unit: calendar
    counting: FRCP_6a
    trigger: entry_of_judgment
    maps_to: [entry_of_judgment]
    party_role: either
    forum: federal_trial
    waivable: false
    jurisdictional: false
    notes: "'Reasonable time' — no fixed limit. (4) effectively no limit since void judgments are nullities."
    requires_state: [post_judgment_total, post_dismissal_partial, post_judgment_appealed, appeal_decided]

  - id: frcp_60d3_fraud_on_court
    citation: "FRCP 60(d)(3)"
    name: "Independent action — fraud on the court"
    description: "Set aside judgment for fraud on the court."
    days: null
    unit: calendar
    counting: FRCP_6a
    trigger: any
    maps_to: [entry_of_judgment, latest_order]
    party_role: either
    forum: federal_trial
    waivable: false
    jurisdictional: false
    notes: "No time limit. Reserved for egregious misconduct by officers of the court."
    requires_state: [post_judgment_total, post_dismissal_partial, post_judgment_appealed, appeal_decided]

  - id: frcp_56_summary_judgment
    citation: "FRCP 56(b)"
    name: "Summary judgment motion"
    description: "Motion for summary judgment — default cutoff if no scheduling order."
    days: 30
    unit: calendar
    counting: FRCP_6a
    trigger: close_of_discovery
    maps_to: []  # rarely computable from yaml
    party_role: either
    forum: federal_trial
    waivable: true
    jurisdictional: false
    notes: "Default; scheduling order typically supersedes."
    requires_state: [pre_judgment, pre_judgment_removal_pending, trial_in_progress]

  - id: edpa_local_71c_response
    citation: "EDPA L.R. 7.1(c)"
    name: "Response to motion (EDPA)"
    description: "Response to non-dispositive motion in Eastern District of Pennsylvania."
    days: 14
    unit: calendar
    counting: FRCP_6a
    trigger: motion_filed
    maps_to: []  # context-dependent; only fires when a motion is pending against us
    party_role: either
    forum: federal_trial
    waivable: true
    jurisdictional: false

# ──────────────────────────────────────────────────────────────────────────
# FEDERAL APPELLATE — FRAP / Third Circuit Local Rules
# ──────────────────────────────────────────────────────────────────────────
    requires_state: [pre_judgment, pre_judgment_removal_pending, trial_in_progress]

  - id: frap_4a1_civil_appeal
    citation: "FRAP 4(a)(1)(A)"
    name: "Notice of appeal — civil (private party)"
    description: "Notice of appeal in civil case where US is not a party."
    days: 30
    unit: calendar
    counting: FRAP_26a
    trigger: entry_of_judgment
    maps_to: [entry_of_judgment]
    party_role: either
    forum: federal_appellate
    waivable: false
    jurisdictional: true
    notes: "Bowles v. Russell (2007): hard jurisdictional limit. Untimely = appellate court loses jurisdiction."
    requires_state: [post_judgment_total, post_dismissal_partial]

  - id: frap_4a1_civil_appeal_us
    citation: "FRAP 4(a)(1)(B)"
    name: "Notice of appeal — civil (US a party)"
    description: "When the United States or federal officer is a party."
    days: 60
    unit: calendar
    counting: FRAP_26a
    trigger: entry_of_judgment
    maps_to: []  # only if US is a party — verify per case
    party_role: either
    forum: federal_appellate
    waivable: false
    jurisdictional: true
    requires_state: [post_judgment_total, post_dismissal_partial]

  - id: frap_4a4_tolling
    citation: "FRAP 4(a)(4)"
    name: "Tolling motions extend appeal clock"
    description: "Timely Rule 50(b), 52(b), 59, or 60 (if filed within 28 days) motion tolls FRAP 4."
    days: 30
    unit: calendar
    counting: FRAP_26a
    trigger: order_disposing_tolling_motion
    maps_to: []
    party_role: either
    forum: federal_appellate
    waivable: false
    jurisdictional: true
    notes: "Appeal clock restarts when tolling motion is disposed of."
    requires_state: [post_judgment_total, post_dismissal_partial]

  - id: frap_4a5_extension
    citation: "FRAP 4(a)(5)"
    name: "Extension of time to appeal"
    description: "Motion for extension; excusable neglect or good cause."
    days: 30
    unit: calendar
    counting: FRAP_26a
    trigger: expiration_of_appeal_period
    maps_to: []
    party_role: either
    forum: federal_appellate
    waivable: false
    jurisdictional: false
    notes: "Max 30-day extension beyond original deadline or 14 days from grant, whichever is later."
    requires_state: [post_judgment_total, post_dismissal_partial]

  - id: frap_4a6_reopen
    citation: "FRAP 4(a)(6)"
    name: "Reopen appeal period for failure of notice"
    description: "Reopen when party did not receive Rule 77(d) notice of judgment."
    days: 14
    unit: calendar
    counting: FRAP_26a
    trigger: receipt_or_knowledge_of_judgment
    maps_to: []
    party_role: either
    forum: federal_appellate
    waivable: false
    jurisdictional: false
    notes: "Earlier of: 180 days from judgment entry OR 14 days from notice receipt."
    requires_state: [post_judgment_total, post_dismissal_partial]

  - id: frap_10e2_correction_of_record
    citation: "FRAP 10(e)(2)(B)"
    name: "Correction of record on appeal"
    description: "Correct/supplement record when material is omitted or misstated."
    days: null
    unit: calendar
    counting: FRAP_26a
    trigger: any
    maps_to: [appeal_filed]
    party_role: either
    forum: federal_appellate
    waivable: false
    jurisdictional: false
    notes: "May be done at any time before appeal is decided."
    requires_state: [post_judgment_appealed, appeal_decided]

  - id: frap_31_appellant_brief
    citation: "FRAP 31(a)(1)"
    name: "Appellant's opening brief"
    description: "Brief due 40 days after record filed."
    days: 40
    unit: calendar
    counting: FRAP_26a
    trigger: record_filed_on_appeal
    maps_to: []
    party_role: either
    forum: federal_appellate
    waivable: true
    jurisdictional: false
    requires_state: [post_judgment_appealed]

  - id: frap_31_appellee_brief
    citation: "FRAP 31(a)(1)"
    name: "Appellee's response brief"
    description: "Brief due 30 days after appellant's brief served."
    days: 30
    unit: calendar
    counting: FRAP_26a
    trigger: appellant_brief_served
    maps_to: []
    party_role: either
    forum: federal_appellate
    waivable: true
    jurisdictional: false
    requires_state: [post_judgment_appealed]

  - id: frap_31_reply_brief
    citation: "FRAP 31(a)(1)"
    name: "Reply brief"
    description: "Reply brief due 21 days after appellee's brief served."
    days: 21
    unit: calendar
    counting: FRAP_26a
    trigger: appellee_brief_served
    maps_to: []
    party_role: either
    forum: federal_appellate
    waivable: true
    jurisdictional: false
    requires_state: [post_judgment_appealed]

  - id: frap_40_panel_rehearing
    citation: "FRAP 40(a)(1)"
    name: "Petition for panel rehearing"
    description: "Petition for rehearing by the panel of judges that decided the appeal."
    days: 14
    unit: calendar
    counting: FRAP_26a
    trigger: entry_of_judgment_on_appeal
    maps_to: [appeal_decided]
    party_role: either
    forum: federal_appellate
    waivable: false
    jurisdictional: false
    notes: "45 days if US/federal officer/agency is a party. 2024 amendment combined panel rehearing and rehearing en banc procedures."
    requires_state: [appeal_decided]

  - id: frap_40_en_banc_rehearing
    citation: "FRAP 40(b) / 3d Cir L.A.R. 35"
    name: "Petition for rehearing en banc"
    description: "Petition for full-court rehearing."
    days: 14
    unit: calendar
    counting: FRAP_26a
    trigger: entry_of_judgment_on_appeal
    maps_to: [appeal_decided]
    party_role: either
    forum: federal_appellate
    waivable: false
    jurisdictional: false
    notes: "45 days if US/federal officer/agency is a party."
    requires_state: [appeal_decided]

  - id: lar_3rd_cir_107_2_mandate
    citation: "3d Cir L.A.R. 107.2"
    name: "Issuance of mandate"
    description: "Mandate issues 7 days after disposition of petition for rehearing or expiration of time to file."
    days: 7
    unit: calendar
    counting: FRAP_26a
    trigger: rehearing_disposed_or_period_expired
    maps_to: [appeal_decided]
    party_role: either
    forum: federal_appellate
    waivable: false
    jurisdictional: false

