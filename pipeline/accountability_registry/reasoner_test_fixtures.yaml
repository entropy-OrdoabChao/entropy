# reasoner_test_fixtures.yaml — known-answer anti-hallucination tests
#
# Each fixture exercises the reasoner with a known answer. The reasoner output
# must (a) match expected_verdict OR be INSUFFICIENT_AUTHORITY (acceptable degrade),
# and (b) contain at least one of the expected_citation_tokens verbatim.
#
# If a fixture fails with hallucination (verdict matches but no expected token),
# that's a CRITICAL failure — install should abort.

version: "0.1"

fixtures:
  # ──────────────────────────────────────────────────────────────────────────
  # Stage B fixtures — confirm/reject snippets
  # ──────────────────────────────────────────────────────────────────────────

  - id: stage_b_1099c_real
    stage: B
    signal_subtype: "1099_signals"
    snippet: "Example Card Issuer issued Form 1099-C cancellation of debt on 06/10/2024 reporting cancellation of $3,408 of plaintiff's account."
    expected_verdict: ["YES"]
    expected_citation_tokens: ["Form 1099-C", "26 U.S.C. § 6050P"]
    notes: "Clear factual statement of 1099-C issuance — should confirm."

  - id: stage_b_1099c_citation_only
    stage: B
    signal_subtype: "1099_signals"
    snippet: "See generally Smith, Treatise on Federal Taxation § 8.04 (discussing 1099-C cancellation of debt income)."
    expected_verdict: ["NO", "AMBIGUOUS", "INSUFFICIENT_AUTHORITY"]
    expected_citation_tokens: ["Form 1099-C", "26 U.S.C. § 6050P"]
    notes: "Citation to a treatise discussing 1099-C — not an actual 1099-C event."

  - id: stage_b_1099c_negation
    stage: B
    signal_subtype: "1099_signals"
    snippet: "Plaintiff alleges that no 1099-C was ever issued to him despite the alleged settlement."
    expected_verdict: ["NO", "AMBIGUOUS"]
    expected_citation_tokens: ["Form 1099-C"]
    notes: "Explicit negation — should not confirm a 1099-C event."

  - id: stage_b_tigta_jurisdiction
    stage: B
    signal_subtype: "tax"
    snippet: "Plaintiff alleges that IRS Revenue Officer John Doe filed a frivolous lien against him in retaliation for his Tax Court petition."
    expected_verdict: ["YES"]
    expected_citation_tokens: ["TIGTA", "IRS employees", "IRS Restructuring and Reform Act"]
    notes: "IRS employee misconduct — within TIGTA jurisdiction."

  - id: stage_b_tigta_misapplication
    stage: B
    signal_subtype: "tax"
    snippet: "Example Card Issuer issued an inaccurate 1099-C; plaintiff requests TIGTA investigation of Example Card Issuer's filing practices."
    expected_verdict: ["NO", "AMBIGUOUS", "INSUFFICIENT_AUTHORITY"]
    expected_citation_tokens: ["TIGTA", "IRS employees"]
    notes: "Private creditor 1099-C — outside TIGTA jurisdiction. LLM should reject or flag misapplication."

  - id: stage_b_judicial_immunity_judicial_act
    stage: B
    signal_subtype: "judicial"
    snippet: "Plaintiff seeks $1M in damages from Judge Smith for entering an order denying remand without explanation."
    expected_verdict: ["YES", "AMBIGUOUS"]
    expected_citation_tokens: ["judicial immunity", "Bradley v. Fisher", "Stump v. Sparkman"]
    notes: "Denying remand is a judicial act — absolute immunity bars damages."

  - id: stage_b_bivens_judicial
    stage: B
    signal_subtype: "color_of_law"
    snippet: "Plaintiff brings a Bivens action against federal District the Judge for the order dismissing his case."
    expected_verdict: ["NO", "AMBIGUOUS"]
    expected_citation_tokens: ["Bivens", "Egbert v. Boule", "judicial immunity"]
    notes: "Bivens does NOT extend to federal judges post-Egbert."

  - id: stage_b_force_placed_actual
    stage: B
    signal_subtype: "force_placed_insurance"
    snippet: "Amerisave force-placed hazard insurance at $4,200/year while plaintiff's existing policy was active, and charged it to escrow without 45-day notice."
    expected_verdict: ["YES"]
    expected_citation_tokens: ["12 C.F.R. § 1024.37", "force-placed"]
    notes: "Classic Reg X violation pattern."

  - id: stage_b_8371_proper_insured
    stage: B
    signal_subtype: "bad_faith"
    snippet: "Plaintiff, the named insured under State Farm policy 12345, alleges State Farm denied her claim for hailstorm damage without investigation."
    expected_verdict: ["YES"]
    expected_citation_tokens: ["42 Pa.C.S. § 8371", "Terletsky"]
    notes: "Plaintiff is the insured — direct § 8371 standing exists."

  - id: stage_b_8371_third_party
    stage: B
    signal_subtype: "bad_faith"
    snippet: "Plaintiff, a third-party tort victim, sues State Farm directly under § 8371 for bad-faith denial of her uninsured-motorist claim."
    expected_verdict: ["NO", "AMBIGUOUS"]
    expected_citation_tokens: ["42 Pa.C.S. § 8371"]
    notes: "Third parties generally lack direct § 8371 standing absent assignment."

  # ──────────────────────────────────────────────────────────────────────────
  # Stage D fixtures — path triage
  # ──────────────────────────────────────────────────────────────────────────

  - id: stage_d_tigta_for_private_1099c
    stage: D
    path_id: "tigta_investigations"
    confirmed_facts:
      - "[1099_signals] Example Card Issuer issued Form 1099-C cancellation of debt on 06/10/2024 reporting $3,408"
      - "[fcra] Defendant continued reporting the discharged debt as outstanding balance after 1099-C issuance"
    expected_verdict: ["INAPPLICABLE", "INSUFFICIENT_AUTHORITY"]
    expected_citation_tokens: ["TIGTA", "IRS employees"]
    notes: "TIGTA does NOT have jurisdiction over private creditor 1099-C filings. This is the user's exact 02822 scenario."

  - id: stage_d_section_7434_for_1099c
    stage: D
    path_id: "section_7434_civil_action"
    confirmed_facts:
      - "[1099_signals] Example Card Issuer issued Form 1099-C cancellation of debt on 06/10/2024 reporting $3,408"
      - "[fcra] Plaintiff alleges the underlying debt was never properly cancelled and the 1099-C is fraudulent"
    expected_verdict: ["APPLIES", "INSUFFICIENT_AUTHORITY"]
    expected_citation_tokens: ["26 U.S.C. § 7434", "willfully filed", "fraudulent information return"]
    notes: "If plaintiff plausibly alleges willful falsity, § 7434 applies. Strict willfulness requirement noted."

  - id: stage_d_1983_against_federal_judge
    stage: D
    path_id: "section_1983_civil_action"
    confirmed_facts:
      - "[judicial] Federal District the Judge (EDPA) entered orders dismissing plaintiff's cases without reasoning"
    expected_verdict: ["INAPPLICABLE"]
    expected_citation_tokens: ["42 U.S.C. § 1983", "under color of state law"]
    notes: "§ 1983 does NOT reach federal judges; need Bivens (and Bivens doesn't reach judges either)."

  - id: stage_d_8371_for_third_party
    stage: D
    path_id: "pa_bad_faith_section_8371"
    confirmed_facts:
      - "[insurance] Plaintiff is a third-party tort claimant, not an insured under State Farm policy"
    expected_verdict: ["INAPPLICABLE"]
    expected_citation_tokens: ["42 Pa.C.S. § 8371"]
    notes: "§ 8371 standing limited to insureds; third parties need assignment or garnishment."

  - id: stage_d_3d_cir_judicial_council
    stage: D
    path_id: "third_circuit_judicial_council"
    confirmed_facts:
      - "[judicial] Federal District the Judge (EDPA) entered orders dismissing plaintiff's cases without reasoning, deviating from accepted course of judicial proceedings"
    expected_verdict: ["APPLIES"]
    expected_citation_tokens: ["28 U.S.C. § 351", "Judicial Conduct and Disability Act"]
    notes: "Federal judge + procedurally non-merits-only complaint → judicial council is appropriate forum."
