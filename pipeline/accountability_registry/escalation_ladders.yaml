        provenance: "official:consumerfinance.gov/complaint/process (2026-08-13) — 15 cal / 60 final"
        on_expiry: "company response; then escalate"
      - level: fcra_suit
        deadline_days: 730                       # 2 yr from discovery (5 yr max), 1681p
        working: false
        cite: "15 U.S.C. 1681p (2 yr from discovery / 5 yr repose); 1681n willful / 1681o negligent"
        provenance: "corpus:1681p"
        on_expiry: "FCRA suit / time-barred if missed"

