# escalation_ladders.yaml  — SANDBOX DRAFT (not yet live)
# Per-forum ESCALATION LEVELS with each level's day-clock, grounding cite, and on_expiry consequence.
# Extends accountability_forums.yaml (which has the forum CHAINS but no deadlines/sub-levels).
# Feeds: the accountability_tracker deadline sweep (RUNG_DEADLINES) + the per-claim ledger next-best-action.
#
# provenance per level:
#   corpus:<cite>   = statutory/rule deadline FTS-CONFIRMED present in the corpus (chunk_text.db) on 2026-08-12
#   NEEDS_GROUNDING = an agency INTERNAL/policy response window (not statutory); ground via corpus semantic
#                     or fetch the official policy page + INSERT->turbovec_ingest. NEVER guess the number.
# working: true = business days (weekends excluded); on_expiry names the legal consequence recorded.
# R2: no case/party names here — actor/forum keys only, data-driven.

ladders:

  # ---- FEDERAL AGENCY RECORDS (evidence-getter for every matter) ----
  foia:
    forum: "Federal agency FOIA/Privacy Act office"
    levels:
      - level: request
        deadline_days: 20
        working: true
        cite: "5 U.S.C. 552(a)(6)(A)(i)"
        provenance: "corpus:552(a)(6)(A)(i)"
        on_expiry: "constructive denial — deemed exhausted (5 U.S.C. 552(a)(6)(C)(i))"
      - level: administrative_appeal
        deadline_days: 20
        working: true
        cite: "5 U.S.C. 552(a)(6)(A)(ii)"
        provenance: "corpus:552(a)(6)(A)(ii)"
        on_expiry: "appeal deemed denied — judicial review ripe"
      - level: ogis_mediation                 # optional, NON-tolling dispute resolution
        deadline_days: null
        working: false
        cite: "5 U.S.C. 552(h)"
        provenance: "corpus:552(h)"
        on_expiry: "mediation exhausted/declined — proceed to court"
      - level: district_court
        deadline_days: 30                      # agency answer window once suit filed
        working: false
        cite: "5 U.S.C. 552(a)(4)(B), (a)(4)(C)"
        provenance: "corpus:552(a)(4)(B)"
        on_expiry: "de novo review; agency bears burden"

  # ---- TORT vs. a FEDERAL agency/regulator that failed its duty (ladder rung 4) ----
  ftca:
    forum: "Federal agency (administrative tort claim) -> U.S. District Court"
    levels:
      - level: administrative_claim            # SF-95 presentment
        deadline_days: 180                     # agency has 6 months to act
        working: false
        cite: "28 U.S.C. 2675(a)"
        provenance: "corpus:2675(a)"
        on_expiry: "deemed final denial — suit permitted"
      - level: district_court
        deadline_days: 180                     # suit within 6 months of final denial
        working: false
        cite: "28 U.S.C. 2401(b)"
        provenance: "corpus:2401(b)"
        on_expiry: "FTCA suit filed / time-barred if missed"

  # ---- COMPEL / REVIEW agency action (APA) ----
  apa_review:
    forum: "Reviewing court designated by the agency's statute"
    levels:
      - level: final_agency_action
        deadline_days: null                    # no fixed clock; 'unreasonably delayed' is the trigger
        working: false
        cite: "5 U.S.C. 706(1)"
        provenance: "corpus:706(1)"
        on_expiry: "compel withheld/unreasonably delayed action"
      - level: petition_for_review
        deadline_days: 2190                     # general 6-yr SOL against the U.S. (~6*365)
        working: false
        cite: "28 U.S.C. 2401(a)"
        provenance: "corpus:2401(a)"
        on_expiry: "review barred if not filed within limitations"

  # ---- JUDICIAL MISCONDUCT (federal Art. III judge) ----
  judge_federal:
    forum: "Circuit Judicial Council -> Judicial Conference Committee -> (DOJ / impeachment)"
    levels:
      - level: circuit_complaint               # filed with the CIRCUIT (Chief Judge review)
        deadline_days: null                    # no complainant filing deadline
        working: false
        cite: "28 U.S.C. 351-352; Rules for Judicial-Conduct Proceedings Rule 6-11"
        provenance: "corpus:351"
        on_expiry: "Chief Judge disposition triggers the petition clock"
      - level: petition_for_review             # to the Judicial Council after a 352 dismissal
        deadline_days: 42
        working: false
        cite: "Rules for Judicial-Conduct Proceedings Rule 18(b); 28 U.S.C. 352(c)"
        provenance: "corpus:42 days / Rule 18"
        on_expiry: "Council review; then national Committee"
      - level: national_committee_review       # Committee on Judicial Conduct & Disability of the Judicial Conference of the U.S. (the NATIONAL body)
        deadline_days: null
        working: false
        cite: "28 U.S.C. 331 (Judicial Conference); 28 U.S.C. 357; Rules for Judicial-Conduct Proceedings 21-22"
        provenance: "corpus:331 + Committee on Judicial Conduct and Disability"  # FTS-confirmed 2026-08-12
        on_expiry: "FINAL — 28 U.S.C. 357(c): the conduct orders are NOT subject to judicial review; no court sits above the national committee"
      - level: congressional_impeachment       # the ONLY removal for an Art. III judge once conduct review is final
        deadline_days: null
        working: false
        cite: "U.S. Const. art. III (good-Behaviour tenure); art. I (House sole power of impeachment; Senate tries)"
        provenance: "corpus:good behaviour + sole power of impeachment"
        on_expiry: "House Judiciary refer -> House impeach -> Senate try/remove"
      - level: doj_criminal_referral
        deadline_days: null
        working: false
        cite: "18 U.S.C. 242, 241 (color-of-law); general SOL 18 U.S.C. 3282 (5 yr)"
        provenance: "corpus:242"
        on_expiry: "criminal referral (civil damages barred by absolute judicial immunity — the immunity to pierce)"

  # ---- JUDICIAL MISCONDUCT (PA state judge) ----
  judge_state_pa:
    forum: "PA Judicial Conduct Board -> Court of Judicial Discipline -> PA Supreme Court"
    levels:
      - level: jcb_complaint
        deadline_days: null
        working: false
        cite: "Pa. Const. art. V, 18; C.J.D.R.P."
        provenance: "corpus:Judicial Conduct Board"
        on_expiry: "Board investigates; may file charges"
      - level: court_of_judicial_discipline
        deadline_days: null
        working: false
        cite: "Pa. Const. art. V, 18(b); C.J.D.R.P."
        provenance: "corpus:Judicial Conduct Board"  # FTS-confirmed; CJD adjudication has no complainant clock
        on_expiry: "adjudication; sanctions"

  # ---- WHEN THE OVERSIGHT BODY ITSELF FAILS (JCB/CJD/ODC/regulator covers for the person it oversees) ----
  # The watchers of the watchers. The PA JCB is constitutionally INDEPENDENT (Pa. Const. art. V, 18) — no
  # single regulator sits above it — so accountability is multi-avenue. This is ladder-rung 4 (sue the
  # overseer who won't do its job) applied RECURSIVELY to the oversight body. Fires when an oversight body
  # refuses to act, breaks its own rules/policy, or covers up. The federal color-of-law rung is the
  # immunity-piercing avenue that climbs to the Supreme Court (the mission's endgame).
  oversight_of_oversight:
    forum: "PA Supreme Court (King's Bench) -> mandamus -> General Assembly (impeachment) -> DOJ / federal color-of-law"
    applies_when: "an oversight body (JCB, CJD, ODC, an agency/regulator) refuses to act, violates its own rules, or covers for the person it oversees"
    levels:
      - level: kings_bench_petition            # in-system supervisory backstop
        deadline_days: null
        working: false
        cite: "42 Pa.C.S. 726 (extraordinary/plenary jurisdiction); Pa. Const. art. V, 10(a) (supervisory authority over all courts)"
        provenance: "corpus:art V 10(a) + extraordinary jurisdiction"
        on_expiry: "Supreme Court may assume plenary jurisdiction to compel/review"
      - level: mandamus                         # compel a non-discretionary duty
        deadline_days: null
        working: false
        cite: "42 Pa.C.S. 761 (Cmwlth Ct original jurisdiction); Pa.R.A.P. 1531"
        provenance: "corpus:mandamus / 761"
        on_expiry: "compel the body to perform its mandatory duty"
      - level: impeachment_referral             # removal of the covering officers
        deadline_days: null
        working: false
        cite: "Pa. Const. art. VI (House impeaches; Senate tries; all civil officers liable)"
        provenance: "corpus:impeachment of civil officers"
        on_expiry: "General Assembly may impeach/remove"
      - level: federal_color_of_law             # THE IMMUNITY-PIERCING avenue -> SCOTUS endgame
        deadline_days: null
        working: false
        cite: "18 U.S.C. 242, 241 (criminal color-of-law); 42 U.S.C. 1983 (civil, individual capacity)"
        provenance: "corpus:242 + 1983"
        on_expiry: "DOJ Civil Rights referral + 1983 suit; quasi-judicial immunity litigated -> appeals -> SCOTUS (pierce immunity where it does not serve law/justice)"

  # ---- WHEN THE BAR / ATTORNEY-DISCIPLINE BODY FAILS (Disciplinary Board / ODC covers for a lawyer) ----
  # The disciplinary board is an ARM of the state's highest court, which has EXCLUSIVE jurisdiction over
  # attorney admission and discipline (Pa. Const. art. V, 10(c); Pa.R.D.E.). So the board answers to the
  # PA Supreme Court, which reviews. CAVEAT: the American Bar Association is a PRIVATE, voluntary body — it
  # accredits law schools + writes Model Rules but has ZERO disciplinary authority; a complaint to the ABA
  # is unenforceable. The real regulator is the state supreme court's board.
  bar_oversight:
    forum: "State Supreme Court (exclusive attorney-discipline jurisdiction) -> King's Bench -> impeachment -> DOJ / federal"
    applies_when: "the Disciplinary Board / Office of Disciplinary Counsel refuses to act, breaks its own rules, or covers for a lawyer"
    levels:
      - level: supreme_court_review             # the board is the Court's own arm
        deadline_days: null
        working: false
        cite: "Pa. Const. art. V, 10(c) (Supreme Court exclusive rule-making over bar admission/practice); Pa.R.D.E."
        provenance: "corpus:exclusive jurisdiction over attorney discipline + Rules of Disciplinary Enforcement"
        on_expiry: "petition the PA Supreme Court to review/compel the board"
      - level: kings_bench_mandamus             # if the Court/board still will not act
        deadline_days: null
        working: false
        cite: "42 Pa.C.S. 726 (extraordinary jurisdiction); 42 Pa.C.S. 761 + Pa.R.A.P. 1531 (mandamus)"
        provenance: "corpus:extraordinary jurisdiction + mandamus"
        on_expiry: "compel the mandatory disciplinary duty"
      - level: federal_color_of_law             # cover-up under color of state law
        deadline_days: null
        working: false
        cite: "18 U.S.C. 242, 241; 42 U.S.C. 1983"
        provenance: "corpus:242 + 1983"
        on_expiry: "DOJ referral + 1983 suit -> appeals -> SCOTUS"
      # NOTE: American Bar Association = PRIVATE/voluntary accreditor, NO disciplinary authority — never route enforcement there.
      - level: federal_court_bar                 # misconduct before a federal court
        deadline_days: null
        working: false
        cite: "each federal court's admission/discipline authority; reciprocal discipline"
        provenance: "corpus:American Bar Association (contrast) + federal court bar"
        on_expiry: "the federal court disciplines + refers for reciprocal discipline"

