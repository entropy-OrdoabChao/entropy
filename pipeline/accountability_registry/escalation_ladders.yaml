        provenance: "corpus:5524 two years"    # FTS-confirmed; 8371 bad-faith runs on the 5524 2-yr clock (case law)
        on_expiry: "bad-faith suit / time-barred if missed"

  # ---- MORTGAGE SERVICING (RESPA/Reg X) — the foreclosure-defense clock ladder ----
  # CFPB is the PRIMARY regulator for ANY mortgage servicer, bank or non-bank (webfetch usa.gov/mortgage-
  # company-complaints + consumerfinance.gov, 2026-08-13). QWR/NOE must go to the servicer's DESIGNATED
  # address (Reg X). State banking dept = licensing; HUD = fair-housing/FHA; Ginnie Mae facilitates the
  # MBS (FHA/VA/USDA), does not guarantee default risk.
  mortgage_servicing:
    forum: "servicer QWR/NOE -> CFPB -> state banking dept -> HUD (FHA/fair-housing) -> RESPA suit"
    levels:
      - level: qwr_acknowledgment              # servicer must acknowledge
        deadline_days: 5
        working: true
        cite: "12 U.S.C. 2605(e)(1); Reg X 12 C.F.R. 1024.36 (send to DESIGNATED address)"
        provenance: "corpus:2605(e) 5 days + designated address"
        on_expiry: "servicer in default of acknowledgment duty"
      - level: qwr_response                     # servicer must correct/explain
        deadline_days: 30
        working: true
        cite: "12 U.S.C. 2605(e)(2); Reg X 1024.35/.36 (30 business days, +15 extension)"
        provenance: "corpus:2605(e) 30 days"
        on_expiry: "RESPA violation — actual + statutory damages accrue"
      - level: cfpb_complaint                   # primary regulator for servicers
        deadline_days: 15
        working: false
        cite: "12 U.S.C. 5481 (CFPA); CFPB complaint program"
        provenance: "corpus:CFPA 5481 | official:consumerfinance.gov/complaint/process (2026-08-13) — company responds 15 cal days, final <=60"
        on_expiry: "company response (or 60-day final); then escalate"
      - level: state_banking_dept               # licensing / state consumer protection
        deadline_days: null
        working: false
        cite: "PA Dept of Banking and Securities (7 P.S. / 63 P.S. licensing); state UDAP"
        provenance: "corpus:Department of Banking and Securities"
        on_expiry: "state licensing/enforcement referral"
      - level: hud_fha_fairhousing              # FHA-insured / fair-housing angle
        deadline_days: null
        working: false
        cite: "HUD (FHA servicing, 24 C.F.R.); Fair Housing Act 42 U.S.C. 3610 (discrimination)"
        provenance: "corpus:HUD / Government National Mortgage Association"
        on_expiry: "HUD complaint (FHA servicing / housing discrimination)"
      - level: respa_suit
        deadline_days: 1095                      # 3-yr SOL for 2605 servicing claims
        working: false
        cite: "12 U.S.C. 2614 (3 yr for 2605; 1 yr for 2607/2608)"
        provenance: "corpus:2614"
        on_expiry: "RESPA suit / time-barred if missed"

