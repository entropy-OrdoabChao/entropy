  filing:
    method: written_complaint
    mailing_address: 'Judicial Conduct Board

      Commonwealth of Pennsylvania

      Pennsylvania Judicial Center

      601 Commonwealth Avenue, Suite 3500

      P.O. Box 62525

      Harrisburg, PA 17106-2525

      '
    phone: (717) 234-7911
    form_url: https://judicialconductboardofpa.org/filing-a-complaint/
