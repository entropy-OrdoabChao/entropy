  notes: 'Impeachment is the ONLY mechanism to remove Article III judges. Threshold:

    "treason, bribery, or other high crimes and misdemeanors" (Art. II § 4).

    Historical removals: 8 federal judges removed (most recent: G. Thomas Porteous,
    2010).

    '
  sources:
  - https://judiciary.house.gov/
  - https://constitution.congress.gov/browse/article-2/section-4/
  confidence: high
  last_verified: '2026-05-30'
- id: doj_office_of_professional_responsibility
  jurisdiction: federal
  category: statutory
  scope:
  - federal_prosecutor
  - ausa
  - doj_attorney
  - fbi_agent
  - dea_agent
  statutory_basis: 28 C.F.R. Part 0 Subpart G-2; Order No. 2835-2006
  governing_rules: OPR Procedures (internal); reports findings to Professional Misconduct
    Review Unit (PMRU); termination requires Deputy Attorney General approval
  filing:
    method: written_complaint
    online_form: https://justice.gov/opr/submit-professional-misconduct-complaint
    mailing_address: 'Counsel

      Office of Professional Responsibility

      U.S. Department of Justice

      950 Pennsylvania Avenue, N.W., Suite 3266

      Washington, DC 20530-0001

      '
    phone: (202) 514-3365
    fee: 0
    include_in_complaint:
    - Your full name, address, telephone, email
    - Name and title of accused individual
    - Allegation details including court case name and jurisdiction
    - Supporting documents
  remedies_available:
  - private_admonishment
  - public_reprimand
  - suspension
  - removal_from_office
  - referral_to_attorney_disciplinary_board
  - criminal_referral
  remedies_NOT_available:
  - monetary_damages
  - case_reopening
  - vacatur_of_order
  escalation:
    next_forum: doj_pmru_dag
    mechanism: Professional Misconduct Review Unit decides discipline; Deputy Attorney
      General final authority
  elements_to_plead:
  - Misconduct must relate to DOJ attorney's authority to investigate, litigate, or
    provide legal advice
  - 'Common allegations: Brady/Giglio violations, discovery failures, lack of candor,
    conflict of interest, grand jury abuse'
  common_pitfalls:
  - OPR will NOT investigate while related litigation is pending (policy of restraint)
  - Does NOT cover non-DOJ attorneys (state/local prosecutors, private attorneys)
  - Does NOT cover other federal agencies (DHS, IRS, HHS, etc.) — those go to respective
    OIG
  - Administrative violations (time/attendance) → DOJ OIG, not OPR
  notes: 'FY2023: OPR completed 19 investigations; found professional misconduct in
    68% of matters.

    Annual report: https://www.justice.gov/opr/media/1341446/dl

    '
  sources:
  - https://www.justice.gov/opr/submit-professional-misconduct-complaint
  - https://www.justice.gov/opr/contact-office.html
  - https://www.justice.gov/opr/webform/how-file-complaint-office-professional-responsibility
  - https://www.ecfr.gov/current/title-28/chapter-I/part-0/subpart-G-2
  confidence: high
  last_verified: '2026-05-30'
