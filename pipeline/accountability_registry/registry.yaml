  elements_to_plead:
  - Identify servicer + force-placed carrier
  - Show borrower had hazard insurance OR was current on premium escrow
  - Document servicer's failure to comply with notice requirements (12 C.F.R. § 1024.37(c))
  - Document inflated premium relative to comparable market rate
  - Document 'tracking fees' or commissions paid by force-placed carrier to servicer
  common_pitfalls:
  - Borrower must demonstrate hazard coverage was in place; gap periods often hard
    to disprove
  - Reg X requires advance notice; missing the notice is a per-se violation
