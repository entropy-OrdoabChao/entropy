- id: scotus_no_forum_limitation
  jurisdiction: federal
  category: limitation_note
  scope:
  - scotus_justice
  statutory_basis: U.S. Const. Art. II § 4; Art. I § 2 cl. 5; Art. I § 3 cl. 6-7
  limitation_note: "SCOTUS Justices are NOT subject to the Judicial Conduct and Disability\
    \ Act\n(28 U.S.C. §§ 351-364). The Act covers only Article III \"judges of the\
    \ United\nStates\" as defined in § 451, which excludes SCOTUS Justices, AND Article\
    \ I\nmagistrate/bankruptcy judges. The Justices have adopted a non-binding\n\"\
    Code of Conduct for Justices\" (Nov. 2023) but it provides NO complaint\nforum\
    \ and NO enforcement mechanism.\n\nONLY constitutional mechanisms against a sitting\
    \ Justice:\n  1. Impeachment by the House (Art. II § 4)\n  2. Trial and conviction\
    \ by the Senate (Art. I § 3 cl. 6-7)\n  3. Voluntary recusal under 28 U.S.C. §\
    \ 455 (no review mechanism)\n\nHistorical: 1 Justice impeached (Samuel Chase,\
    \ 1804); acquitted by Senate.\nNo Justice has ever been removed.\n"
  filing: {}
  remedies_available:
  - impeachment_resolution
  remedies_NOT_available:
  - private_admonishment
  - public_reprimand
  - censure
  - suspension
  - removal_from_office
  escalation:
    next_forum: house_judiciary_committee_impeachment
    mechanism: Citizen petition to House Member; House Judiciary Committee initiates
      inquiry
  notes: Documented as a hard limitation, NOT a forum. Useful for setting realistic
    expectations in cert-track strategy.
  sources:
  - https://www.supremecourt.gov/about/code-of-conduct-for-justices_november_13_2023.pdf
  - https://www.law.cornell.edu/uscode/text/28/451
  - https://constitution.congress.gov/browse/article-2/section-4/
  confidence: high
  last_verified: '2026-05-30'
