  forum: phila_ccp
  name: Bad Faith Civil Action under 42 Pa.C.S. § 8371
  statutory_basis: 42 Pa.C.S. § 8371 (Actions on insurance policies)
  purpose: Recover statutory damages, interest, attorney fees, and punitive damages
    from an insurer that acted in bad faith toward the insured in handling a claim
  deadline_days: 1460
  deadline_trigger: accrual of claim — typically date of denial or last act of bad
    faith conduct
  deadline_jurisdictional: false
  fee: 0
  word_limit: null
  required_sections:
  - Identification of policy, insurer, claim
  - Identification of insured (only insured has direct § 8371 standing)
  - Specific acts of bad faith (failure to investigate, unreasonable denial, lowball
    offer, delay, etc.)
  - Knowing or reckless disregard standard
  - Damages
  granting_factors:
  - Insurer denied benefits without reasonable basis
  - Insurer knew or recklessly disregarded its lack of reasonable basis
  - Insurer failed to investigate adequately
  - Insurer used unlawful interpretation to delay or deny
  elements_to_plead:
  - Plaintiff is an insured under the policy
  - Insurer's conduct in handling the claim was in bad faith
  - Causation between bad faith and harm
  common_pitfalls:
  - Claimants who are NOT the insured (e.g., judgment creditors, third-party claimants)
    generally lack direct § 8371 standing — must proceed via assignment of rights
    or Pa.R.C.P. 3111 garnishment
  - Burden of proof is 'clear and convincing evidence' (Terletsky v. Prudential, 437
    Pa.Super. 108)
  - Insurer's reasonable basis to deny defeats § 8371 even if denial later proven
    wrong
  - Federal courts may apply § 8371 via diversity jurisdiction but Erie analysis can
    complicate
  - 'Statute of limitations: 4 years (Ash v. Continental Ins. Co., 932 A.2d 877 (Pa.
    2007))'
  notes: "REMEDIES (tracked on phila_ccp forum, NOT on writ dataclass):\n  compensatory_damages,\
    \ punitive_damages, attorney_fees, restitution.\n\n§ 8371 specific remedies: prime\
    \ rate + 3% interest from claim accrual;\npunitive damages; court costs; attorney\
    \ fees.\n\n§ 8371 is PA's signature insurance bad-faith remedy. Independent of\
    \ any\nbreach-of-contract claim on the policy.\n\nFor State Farm bad faith case\
    \ (06077): § 8371 is the headline writ.\nStandard is \"clear and convincing evidence\"\
    \ — high bar but achievable\nwith documented denial timeline + reasonable-basis\
    \ analysis.\n\nFor 04767 (Amerisave force-placed insurance angle): if force-placed\n\
    carrier denied a covered loss or refused refund of inflated premiums,\n§ 8371\
    \ may apply to the force-placed carrier (Assurant, QBE, etc.).\n"
  filing_address: 'Court of Common Pleas of Philadelphia County (or county of insured''s
    residence)

    Office of Judicial Records

    Room 296, Philadelphia City Hall

    Anytown, ST 00000

    '
  service_requirements: Pa.R.C.P. 400 et seq. — service via Sheriff or per court rules
  service_steps:
  - Praecipe for writ of summons OR file complaint
  - Original process to Sheriff for service
  - Service within 30 days of filing per Pa.R.C.P. 401(a)
  sources:
  - https://codes.findlaw.com/pa/title-42-pacsa-judiciary-and-judicial-procedure/pa-cs-sect-42-8371/
  - https://casetext.com/case/terletsky-v-prudential-property-cas-ins-co
  confidence: high
  last_verified: '2026-05-30'
- id: frcp_26_motion_to_compel_insurance_disclosure
  forum: edpa
  name: Motion to Compel Complete FRCP 26(a)(1)(A)(iv) Insurance Disclosure
  statutory_basis: Fed. R. Civ. P. 26(a)(1)(A)(iv); Fed. R. Civ. P. 37(c)
  purpose: Compel defendant to produce complete insurance agreements (primary + excess
    + umbrella + D&O + E&O) when initial disclosures are incomplete, and seek Rule
    37 sanctions
  deadline_days: null
  deadline_trigger: may be filed any time after defendant's Rule 26(a) disclosures
    are due (typically 14 days post-Rule 26(f) conference)
  deadline_jurisdictional: false
  fee: 0
  word_limit: null
  required_sections:
  - Caption
  - Statement of Rule 26(a)(1)(A)(iv) obligation
  - Identification of what defendant produced
  - Identification of what is missing (umbrella, excess, D&O, E&O)
  - Materiality explanation
  - Prayer for production + Rule 37 sanctions
  - Certificate of service
  granting_factors:
  - Rule 26(a)(1)(A)(iv) is automatic and mandatory — no discovery request needed
  - Disclosure required even when insurer contests coverage
  - Defendant has duty to INVESTIGATE all insurance, not just primary
  elements_to_plead:
  - Defendant produced [primary policy / limited declarations] only
  - Defendant failed to produce [umbrella / excess / D&O / E&O / cyber / fidelity]
  - Specific reason to believe additional coverage exists (SEC filings, prior litigation
    disclosures, corporate size)
  common_pitfalls:
  - Must show defendant's disclosure is INCOMPLETE, not just unhelpful
  - Reinsurance disclosure remains contested in some circuits — primary/excess/umbrella
    safer ground
  - Movant must conduct Local Rule 7.1 / 26.1 meet-and-confer before filing in many
    districts
  notes: "REMEDIES (tracked on edpa forum, NOT on writ dataclass):\n  injunctive_relief\
    \ (order compelling production); attorney_fees under Rule 37(c).\n\nPowerful procedural\
    \ motion. Federal defendants frequently produce only\nprimary policy and conceal\
    \ excess/umbrella layers, especially in cases\nwhere plaintiff's likely recovery\
    \ would exceed primary limits. Sanctions\nunder Rule 37(c) include reasonable\
    \ expenses and attorney fees.\n\nPair with discovery into reinsurance for insurance-company\
    \ defendants\nwhere reinsurance may be relevant under Lambert v. Tesla, 923 F.\
    \ Supp. 2d\n(D. Mass. 2013) line of cases.\n\nUse the insurance_carrier_discovery.draft_frcp_26_motion()\
    \ helper for\ntemplate.\n\n\n[no_deadline] — this writ has no fixed deadline;\
    \ timing controlled by underlying procedure (FTCA 2-year admin claim then 6-month\
    \ suit window; FRCP 26 motion ripens 14 days post-26(f) conference)."
  filing_address: 'U.S. District Court for the Eastern District of Pennsylvania

    U.S. Courthouse

    601 Market Street

    Philadelphia, PA 19106

    '
  service_requirements: CM/ECF service on all counsel of record
  service_steps:
  - Meet-and-confer with opposing counsel (Local Civ. R. 26.1(f))
  - File via CM/ECF
  - Serve via CM/ECF on all counsel
  sources:
  - https://www.federalrulesofcivilprocedure.org/frcp/title-v-disclosures-and-discovery/rule-26-duty-to-disclose-general-provisions-governing-discovery/
  - https://natlawreview.com/article/sanctions-failing-to-investigate-insurance-under-federal-rule-26
  confidence: high
  last_verified: '2026-05-30'
- id: attorney_malpractice_civil_action
  forum: phila_ccp
  name: Legal Malpractice / Professional Negligence Civil Action
  statutory_basis: Pennsylvania common law (Bailey v. Tucker, 533 Pa. 237 (1993));
    42 Pa.C.S. § 5524 (2-year SOL for negligence) or § 5525 (4-year for breach of
    contract)
  purpose: Recover damages from an attorney whose negligence in the rendering of legal
    services caused the client harm
  deadline_days: 730
  deadline_trigger: discovery rule applies — accrual when client knew or should have
    known of injury (Knopick v. Connelly)
  deadline_jurisdictional: false
  fee: 250
  word_limit: null
  required_sections:
  - Complaint compliant with Pa.R.C.P. 1019
  - Identification of attorney-client relationship
  - Identification of specific negligent act
  - Identification of harm and causation
  - Damages computation
  granting_factors:
  - Attorney-client relationship existed
  - Attorney's conduct fell below the applicable standard of care
  - 'Causation: ''case within a case'' for trial malpractice (Kituskie v. Corbman,
    552 Pa. 275)'
  - Damages
  elements_to_plead:
  - Existence of attorney-client relationship
  - Negligence or breach by attorney
  - Damages caused by attorney's conduct
  - But-for causation under 'case within a case' doctrine
  common_pitfalls:
  - Statute of limitations (2 years for tort under Pa.C.S. § 5524) often complicates
    — discovery rule may toll
  - '''Case within a case'' doctrine requires proving the underlying case would have
    been won but for malpractice'
  - Punitive damages require additional showing of recklessness/intentional misconduct
  - If attorney had no insurance (per Pa.R.P.C. 1.4(c) disclosure check first), recovery
    may be limited to attorney's personal assets
  notes: "REMEDIES (tracked on phila_ccp forum, NOT on writ dataclass):\n  compensatory_damages,\
    \ punitive_damages, attorney_fees, restitution.\n\nBefore filing, run two checks:\n\
    \  1. PA Disciplinary Board lookup — does attorney self-report E&O coverage?\n\
    \  2. Pa.R.P.C. 1.4(c) disclosure — was client informed of no/low coverage?\n\n\
    If attorney has coverage: tender claim to carrier with demand letter\n(use insurance_carrier_discovery.draft_eo_demand_letter()).\n\
    \nIf attorney has no coverage but failed to disclose: separate Pa.R.P.C.\n1.4(c)\
    \ disciplinary violation, file with Disciplinary Board.\n\nFor pro se: legal malpractice\
    \ claim is technically distinct from\ndisciplinary complaint. File BOTH paths.\n"
  filing_address: 'Court of Common Pleas, Civil Trial Division

    Philadelphia City Hall, Room 296

    Anytown, ST 00000

    '
  service_requirements: Pa.R.C.P. 400 et seq. — original process via Sheriff or by
    certified mail to PA defendant
  service_steps:
  - File complaint with Office of Judicial Records
  - Praecipe for sheriff's service OR Pa.R.C.P. 403 service by mail
  - Service within 30 days per Pa.R.C.P. 401(a)
  sources:
  - https://casetext.com/case/bailey-v-tucker
  - https://casetext.com/case/kituskie-v-corbman
  - https://codes.findlaw.com/pa/title-42-pacsa-judiciary-and-judicial-procedure/pa-cs-sect-42-5524/
  confidence: high
  last_verified: '2026-05-30'
