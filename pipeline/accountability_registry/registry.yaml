    mailing_address: 'Internal Revenue Service

      Fresno, CA 93888

      '
    online: https://www.irs.gov/individuals/how-do-you-report-suspected-tax-fraud-activity
    whistleblower_form: IRS Form 211 (claim for award, if seeking percentage of recovery)
    fee: 0
    anonymous_accepted: true
    what_to_include:
    - Name, address, TIN of person/entity reported
    - Description of alleged violation (with dates, amounts)
    - Form 1099-C copies if challenging fraudulent cancellation reporting
    - Documentation showing debt was NOT actually cancelled or that filer lacked basis
