- id: bivens_action_narrow
  forum: edpa
  name: Bivens Action (Constitutional Tort Against Federal Officer)
  statutory_basis: Bivens v. Six Unknown Named Agents, 403 U.S. 388 (1971); narrowed
    by Egbert v. Boule, 596 U.S. 482 (2022)
  purpose: Damages against federal officer for constitutional violation. No statutory
    analog to § 1983 for federal actors.
  deadline_days: null
  deadline_trigger: borrowed from forum state personal injury SOL — 2 years in PA
  deadline_jurisdictional: false
  fee: $405 (waivable via IFP)
  required_sections:
  - Constitutional violation pleaded with specificity
  - No alternative remedy adequate (special factors counsel hesitation analysis post-Egbert)
  - Defendant is federal officer acting in personal capacity
  granting_factors:
  - Fourth Amendment unreasonable search/seizure (original Bivens context)
  - Fifth Amendment due process (Davis v. Passman, 442 U.S. 228)
  - Eighth Amendment cruel/unusual punishment (Carlson v. Green, 446 U.S. 14)
  elements_to_plead:
  - Federal officer acting under color of federal law
  - Violation of constitutional right within established Bivens context
  - Damages caused by violation
  notes: 'no_deadline statutorily set. EXTREMELY NARROW POST-EGBERT: SCOTUS has refused
    to

    extend Bivens to new contexts in every case since Carlson (1980). Currently viable

    only for 4th Amendment search/seizure, 5th Amendment due process (Davis), and

    8th Amendment medical-neglect (Carlson). Outside these three, Bivens is effectively

    foreclosed.


    For federal employees'' tortious conduct (non-constitutional): use FTCA instead.

    '
  filing_address: 'Clerk of Court

    U.S. District Court for the Eastern District of Pennsylvania

    601 Market Street, Philadelphia, PA 19106-1797

    '
  sources:
