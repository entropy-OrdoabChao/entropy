  notes: 'Pa.R.P.C. 1.4(c) requires PA attorneys in private practice to disclose

    to clients in writing if they do not carry malpractice insurance of at

    least $100,000 per occurrence / $300,000 aggregate. Pa.R.D.E. 219(d)

    requires attorneys to indicate insurance status on their annual fee

    form. The Disciplinary Board publishes this status via its "Look Up

    an Attorney" tool.


    USE: before serving an attorney defendant, check the lookup to confirm

    whether they self-reported coverage. If they reported NO coverage,

    the asset case is harder (no carrier to defend / pay) BUT a Pa.R.P.C.

    1.4(c) disclosure failure is itself a disciplinary violation.


    LIMITATION: tool reveals YES/NO on threshold, not the specific carrier.

    For carrier identity, use FRCP 26 initial disclosures (if federal case)

    or Rule 4005 interrogatory (PA state case).


