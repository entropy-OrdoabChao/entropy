  - scotus_justice
  - federal_judge
  statutory_basis: U.S. Const. Art. II § 4 (good behavior; impeachment); Art. I §
    2 cl. 5 (House power); Art. I § 3 cl. 6 (Senate trial)
  filing:
    method: house_judiciary_intake
