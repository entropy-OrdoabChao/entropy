    to the servicer disguised as "tracking fees."


    Pair CFPB complaint (federal) with PA Insurance Department complaint

    (state) and Reg X civil action (12 U.S.C. § 2605(f) — actual damages +

    $2,000 statutory damages for pattern of noncompliance + attorney fees).


    For 04767 Amerisave: investigate whether any force-placed insurance was

    added to escrow during the disputed period.

