  - Federal employee within scope of employment
  - Discretionary function exception does NOT apply
  common_pitfalls:
  - Discretionary function exception (28 U.S.C. § 2680(a)) bars most claims against
    regulatory officers
  - Intentional torts barred except for limited categories in § 2680(h) (assault/battery/false
    imprisonment/etc. by law enforcement)
  - Bench trial only, no jury (28 U.S.C. § 2402)
  - MUST exhaust SF-95 first — jurisdictional
  notes: 'Two-step process: (1) file Form SF-95 with agency, (2) if denied or 6 months

    pass without action, sue in U.S. district court. Pre-suit notice required.

    No deadline once exhausted, but admin claim is jurisdictional.


    Primary path for damages against repealed-bond US Marshals; for IRS damages

    (limited by discretionary function); for federal employee negligence in scope.



    [no_deadline] — this writ has no fixed deadline; timing controlled by underlying
    procedure (FTCA 2-year admin claim then 6-month suit window; FRCP 26 motion ripens
    14 days post-26(f) conference).'
  filing_address: 'Step 1 (admin claim): The agency employing the wrongdoer (Form
