- id: section_7434_civil_action
  forum: edpa
  name: Civil Action for Fraudulent Filing of Information Returns
  statutory_basis: 26 U.S.C. § 7434
  purpose: Recover statutory damages, actual damages, costs, and (discretionary) attorney's
    fees from a person who willfully filed a fraudulent information return (1099-C,
    1099-MISC, W-2, etc.) about the plaintiff
  deadline_days: null
  deadline_trigger: later of (1) 6 years from filing date of fraudulent return, OR
    (2) 1 year after fraud would have been discovered with reasonable diligence
  deadline_jurisdictional: false
  page_limit: null
  fee: $405 federal filing fee (waivable via IFP)
  required_sections:
  - Caption + parties
  - Jurisdictional statement (26 U.S.C. § 7434(c) — no amount-in-controversy requirement)
  - 'Statement of facts: identify the information return, filer, date filed, amounts
    reported'
  - 'Element 1: Defendant willfully filed information return'
  - 'Element 2: Return was fraudulent'
  - 'Element 3: Return was ''with respect to payments purported to be made to'' plaintiff'
  - 'Prayer for relief: $5,000 statutory OR actual damages + costs + (discretionary)
    attorney''s fees'
  granting_factors:
  - Willfulness (more than mere negligence; intent to file false info)
  - Falsity (return reported amount/event that did not occur)
  - Information return covered by § 6724(d)(1)(A) — includes 1099-C, 1099-MISC, 1099-NEC,
    W-2, etc.
  elements_to_plead:
  - Defendant filed an information return (specify form type)
  - Return was fraudulent (state specific falsity)
  - Defendant acted willfully
  - Return was 'with respect to payments purported to be made to' plaintiff
  service_requirements: 'Sup. Ct. R. — n/a (district court action).

    Critical: § 7434(d) requires plaintiff to PROVIDE A COPY OF THE COMPLAINT TO THE
    IRS

    upon filing. Failure may not be jurisdictional but creates statutory non-compliance.

    Mailing address: Internal Revenue Service, Office of Chief Counsel,

    1111 Constitution Ave NW, Washington DC 20224

    '
  filing_address: 'Clerk of Court

    U.S. District Court for the Eastern District of Pennsylvania

    601 Market Street, Room 2609

    Philadelphia, PA 19106-1797

    '
  copies_required: n/a (electronic filing via PACER); paper copies for chambers per
    local rule
  notes: "no_deadline as a jurisdictional matter, but laches and the 6-year-or-1-year-from-discovery\n\
    SOL applies under § 7434(c).\n\nDAMAGES (§ 7434(b)): liability = GREATER of $5,000\
    \ OR sum of:\n  (1) actual damages from filing (including costs to resolve resulting\
    \ deficiencies)\n  (2) costs of the action\n  (3) reasonable attorney's fees (court's\
    \ discretion)\n\nCourt must include in damages award a finding of the CORRECT\
    \ amount that should\nhave been reported (§ 7434(e)).\n\nPractical use cases:\n\
    \  - Creditor files 1099-C reporting cancellation of debt that was never cancelled\n\
    \    (e.g., debt is in active litigation, debt was sold not cancelled, debt is\
    \ void)\n  - Employer files 1099-MISC misclassifying employee (W-2) as contractor\n\
    \  - Filer reports payments larger than were actually made\n  - Filer reports\
    \ payments to a person who did not receive them\n\nFor pro se in Beezle cases\
    \ (04767, 02822, 06077): if any defendant has filed\na 1099-C reporting cancellation\
    \ of disputed debt, § 7434 is a separate, fee-shifting\nclaim with statutory minimum\
    \ damages. Pair with reporting to IRS via Form 3949-A\n(administrative track)\
    \ and to the case-filing court for the underlying dispute.\n"
  sources:
  - https://www.law.cornell.edu/uscode/text/26/7434
  - https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section7434
  confidence: high
  last_verified: '2026-05-30'
