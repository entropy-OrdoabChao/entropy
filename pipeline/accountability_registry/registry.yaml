- id: ftca_action
  forum: edpa
  name: Federal Tort Claims Act Action
  statutory_basis: 28 U.S.C. §§ 1346(b), 2671-2680
  purpose: Recover damages from United States for torts committed by federal employees
    acting within scope of employment
  deadline_days: null
  deadline_trigger: MUST file administrative claim (SF-95) within 2 years of accrual;
    suit within 6 months of agency denial
  deadline_jurisdictional: true
  fee: $405 (waivable via IFP)
  required_sections:
