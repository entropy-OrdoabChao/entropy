- id: federal_recusal_motion_in_case
  jurisdiction: federal
  category: recusal_in_case
  scope:
  - federal_district_judge
  - federal_circuit_judge
  - federal_magistrate_judge
  - federal_bankruptcy_judge
  - federal_senior_judge
  - federal_judge
  statutory_basis: 28 U.S.C. § 144 (bias affidavit); 28 U.S.C. § 455 (disqualification)
  filing:
    method: efile_pacer
    where: File in the underlying case docket
    fee: 0
    form: Motion + affidavit (§ 144 requires affidavit and certificate of counsel)
  timing:
    deadline: as soon as practicable after grounds for recusal are known; failure
      to act promptly is waiver
  remedies_available:
  - vacatur_of_order
  - case_reopening
  escalation:
    next_forum: writ_of_mandamus_3d_cir
    mechanism: If denied, petition for writ of mandamus to Court of Appeals (FRAP
      21)
  elements_to_plead:
  - '§ 144: timely affidavit stating facts and reasons for personal bias or prejudice;
    certificate of counsel that affidavit is in good faith'
  - '§ 455(a): impartiality might reasonably be questioned'
  - '§ 455(b): specific grounds (personal bias, financial interest, prior involvement,
    family connection)'
  common_pitfalls:
  - Judge rules on own recusal motion (Liljeberg v. Health Servs., 486 U.S. 847)
  - Adverse rulings alone are not grounds (Liteky v. United States, 510 U.S. 540)
  notes: Standard in-case mechanism. Mandamus is the escalation path when denied.
  sources:
  - https://www.law.cornell.edu/uscode/text/28/144
  - https://www.law.cornell.edu/uscode/text/28/455
  confidence: high
  last_verified: '2026-05-30'
