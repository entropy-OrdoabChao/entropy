  statutory_basis: 28 U.S.C. §§ 351-364 (Judicial Conduct and Disability Act)
  governing_rules: Rules for Judicial-Conduct and Judicial-Disability Proceedings
    (RJCP); Local Rules Misconduct Proceedings
  filing:
    method: written_complaint
    form: AO 310 (Rev. 03/16) — Complaint of Judicial Misconduct or Disability
    form_url: https://www.ca3.uscourts.gov/sites/ca3/files/FormalComplaint.Appendix3.pdf
    mailing_address: 'Circuit Executive, United States Third Circuit

      22409 U.S. Courthouse

      601 Market Street

      Philadelphia, Pennsylvania 19106-1790

      '
    envelope_marking: COMPLAINT OF MISCONDUCT or COMPLAINT OF DISABILITY (do NOT name
      judge on envelope)
    fee: 0
    copies: original only; Circuit Executive may request copies of voluminous documents
    signature_required: true
    verification_required: true
    electronic_filing: false
    fax: false
  timing:
    deadline: reasonable time after misconduct
    sol_statutory: null
    typical_review_period_months: 6
  remedies_available:
  - private_admonishment
  - public_reprimand
  - certification_for_impeachment_referral
  - request_voluntary_retirement
  - referral_to_attorney_disciplinary_board
  remedies_NOT_available:
  - monetary_damages
  - vacatur_of_order
  - case_reopening
  escalation:
    next_forum: judicial_conference_committee_on_judicial_conduct
    mechanism: Petition for review to Judicial Council (Rule 18); then Committee on
      Judicial Conduct and Disability of the Judicial Conference (Rule 21)
    petition_review_address: Circuit Executive, United States Third Circuit, 22409
      U.S. Courthouse, 601 Market Street, Philadelphia, PA 19106-1790
  elements_to_plead:
  - 'Specific facts: what happened, when, where'
  - Identify subject judge(s) by name and court
  - Identify any related lawsuits with court + case + appeal docket
  - Signed and verified
  common_pitfalls:
  - Cannot challenge merits of a ruling — that's an appeal, not misconduct (28 U.S.C.
    § 352(b)(1)(A)(ii))
  - Frivolous/repetitive complaints can trigger Rule 10 filing restrictions
  - Confidential per § 360 — does NOT toll deadlines in underlying case
  notes: 'Covers all Article III and Article I federal judges sitting in 3d Cir geography.

    SCOTUS Justices are NOT covered (impeachment only — see scotus_no_forum entry).

    '
  sources:
  - https://www.ca3.uscourts.gov/judicial-conduct-and-disability
  - https://www.ca3.uscourts.gov/sites/ca3/files/info_sheet_misconduct_CE_2015_amend.pdf
  - https://www.ca3.uscourts.gov/sites/ca3/files/FormalComplaint.Appendix3.pdf
  - https://www.law.cornell.edu/uscode/text/28/351
  confidence: high
  last_verified: '2026-05-30'
