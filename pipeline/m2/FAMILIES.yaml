# 2026-10-24 S-m2-cure C1: the Am Jur 2d volumes that govern the PROCEDURE bot's lanes, by lane (keys verified in chunk_text.db;
# vol 61 in corpus is only `amjur2d_61_pipelines` — Pleading is held as the 1stPleading volume, see amjur_pleading)
amjur_summary_judgment: [amjur2d_73_summary_judgment]           # vol 73 — summary judgment (incl. _s9_equitable)
amjur_stare_decisis:    [amjur2d_20_courts]                     # vol 20 — Courts (stare decisis, law of the case, jurisdiction of courts)
amjur_61:               [amjur2d_61_]                           # vol 61 as keyed (pipelines only); Pleading = amjur_pleading
# 2026-10-24 S-m2-forum-families (CLASS RULE: a bot's SEMANTIC families are forum-bound; exact-cite pins never are).
# DEFECT: a Philadelphia CCP run pulled frcp_rule_77 / nj_court_rule_* semantic excerpts because every bot's family
# list is static. Tag = fed | pa | nj | treatise | any. analysis_runner drops a family whose tag is neither the run
# forum (--forum / M2_FORUM / inferred from the facts caption) nor any/treatise. Rules of procedure/evidence/local
# rules are strict to their forum; federal substantive law + U.S. Const + U.S. Reports travel (any); state statutes
# and constitutions stay with their state (a diversity/removed matter passes M2_FORUM=fed,pa). Families not listed
# here fall to the name heuristic in analysis_runner._fam_forum (pa_* → pa, nj*/njac → nj, fr*/ca3*/edpa* → fed).
