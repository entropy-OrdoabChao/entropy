# 2026-11-09 S-corpus-registry-cfr: REGULATIONS. Until now no family named the CFR / Fed. Reg. / generic Pa. Code shelves, so a
# question-type sweep (fetch_bot._classify → every registered family) and the NOT-IN-CORPUS verdict never looked at them, and the bare
# `cfr_` prefix missed the real keys (upper-case `CFR-…`/`ECFR-…`). Prefixes below are the REAL chunk_text.db slugs (census 2026-11-09,
# 340,928 distinct sources; match is case-insensitive). Counts = keys / chunks.
cfr_:     [cfr_, cfr-, ecfr-, courtlistener_cfr_, doi_btfa_25cfr, uscourts_cris_ecfr_]   # CFR-<yyyy>-title<N>-vol<N> govinfo annual 495/364k (+`cfr-` 200-cap twins);
                                                                                         # ECFR-title<N> 98/535k (+`ecfr-` twins); cfr_<title>_<part>_<slug> hand pulls 78/5.5k;
                                                                                         # courtlistener_cfr_<t>_part_<p> 32/969; doi_btfa_25cfr{15,115,1000}. Titles 1-50 all held (35 reserved).
fed_reg:  [fr-]                 # FR-<yyyy>-<mm>-<dd> Federal Register issue — ONLY 83 FR 2018-03-21 held (8 keys / 7.8k chunks); jurisdiction=us_federal_register on the lower-case twin
pa_code_: [pa_code_t, "007_", "010_", "031_", "034_", "037_", "040_", "201_", "204_", "207_", "210_"]   # generic Pa. Code (REGULATIONS, not Pa.C.S.): pa_code_t<T>_ch<N> per-chapter 173/3.7k
                                                                                    # (digit prefixes QUOTED: bare 007_ is YAML octal → int 7)
                                                                                    # + pacodeandbulletin PDFs keyed <title>_<chapter> zero-padded (031_0089 = 31 Pa. Code ch. 89): 527/8.6k —
                                                                                    # titles 7 Agriculture, 10 Banking, 31 Insurance, 34 Labor, 37 Law, 40 Liquor, 201/204/207/210 judicial.
                                                                                    # (`pacode_*` 1-chunk keys are JS landing pages — excluded on purpose.)
# 2026-10-24 S-m2-forum-families (CLASS RULE: a bot's SEMANTIC families are forum-bound; exact-cite pins never are).
# DEFECT: a Philadelphia CCP run pulled frcp_rule_77 / nj_court_rule_* semantic excerpts because every bot's family
# list is static. Tag = fed | pa | nj | treatise | any. analysis_runner drops a family whose tag is neither the run
# forum (--forum / M2_FORUM / inferred from the facts caption) nor any/treatise. Rules of procedure/evidence/local
# rules are strict to their forum; federal substantive law + U.S. Const + U.S. Reports travel (any); state statutes
# and constitutions stay with their state (a diversity/removed matter passes M2_FORUM=fed,pa). Families not listed
# here fall to the name heuristic in analysis_runner._fam_forum (pa_* → pa, nj*/njac → nj, fr*/ca3*/edpa* → fed).
