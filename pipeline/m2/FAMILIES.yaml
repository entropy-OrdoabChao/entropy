# m2 FAMILY REGISTRY (2026-10-20, S-m2-family-scope). A bot's JOB.yaml `families:` names a family; this file maps
# it to the REAL corpus source keys (lower-cased prefix match; "=key" = exact source). A family not listed here keeps
# plain-prefix semantics. `absent: true` = NOT IN CORPUS (ingest via legal-corpus-ingest) — the probe reports it,
# the runner falls back to unscoped retrieval. Probe: python3 -m pipeline.m2.analysis_runner --probe-families
# Source enumeration: chunk_text.db distinct source (340,573 keys, 2026-10-20).
amjur_:          [amjur, treatise_american_jurisprudence, american_jurisprudence, amjur_and_dictionaries]
# Am Jur 2d FEDERAL PRACTICE AND PROCEDURE (32A §§ 51-2162, 32B: removal, appeals, judgments) — the federal-practice
# treatise; its footnotes surface the controlling cases behind each federal rule (user-locked: leverage it).
