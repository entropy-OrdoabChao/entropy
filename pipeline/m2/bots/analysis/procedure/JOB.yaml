queries:
  - "{claim} rule shall"
  - "failure to deny admitted 1029"
  - "waiver Zerbst intentional relinquishment known right"
  - "waiver is ordinarily a question of fact intent to relinquish a known right"
  - "no waiver or estoppel where the party lacked full knowledge of the facts and of his rights"
  - "filing a paper is ministerial; payment of the fee is not jurisdictional"
  - "in forma pauperis applicant need not be a pauper unable to pay costs"
  - "summary judgment genuine issue of material fact burden on the moving party"
  - "stare decisis lower court bound to follow decision of higher court"
  - "clerk must serve notice of the entry of an order or judgment; lack of notice does not affect time to appeal"
cite_rule: enacted P.L./Stat. over codification; flag codification_only when only USC/Pa.C.S. is in corpus
verify: every authority quote must resolve by FTS phrase (runner guardrail) else NOT_IN_CORPUS
handoff: skeptic            # every result is stamped before the case manager records it
