name: procedure
group: analysis
unit: claim            # claim | term | cite | count | document | case | draft
axis: "Axis 4 — PROCEDURE / POSTURE: the SHALL rule at this posture, deadlines, waiver by silence (8(b)(6), 1029(b)), Zerbst symmetry. + waiver is a FACT question needing a known right and intent (no waiver inferred from a reservation, a motion, or silence without a duty to speak); fee/IFP rules are not jurisdictional."
