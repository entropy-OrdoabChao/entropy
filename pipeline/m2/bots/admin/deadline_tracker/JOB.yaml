name: deadline_tracker
group: admin
unit: clock            # claim | term | cite | count | document | case | draft
axis: "ADMIN 4 — DEADLINE TRACKER: every clock the room opened → start event, verbatim rule, due date via deadline_compute_all/deadline_track, mail mode, status."
lane: local-gpu              # production lane only (M2_LANE); local-gpu joins after local-gpu-alone is proven
families:
  - usc_5_552
  - usc_15_1681i
  - usc_12_2605
  - pa_65ps_67
  - frcp_rule_6
