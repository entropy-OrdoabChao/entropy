# Entropy state packs — the PA baseline and each state's equivalents.
# Schema: one entry per state. Every slot names the state's equivalent of what the Pennsylvania pack provides, with its OFFICIAL
# source (the installer fetches only from these; anything else fails the vetting gate). "status: verified" means a human checked
# the source URL and the citation form; "status: draft" means filled from general knowledge and must be verified before release.
# No downloads happen from this file. The pack builder (entropy ingest state <ST>) reads it.
schema:
  slots:
    constitution:        "state constitution, full text"
    statutes:            "codified statutes (the state's code), official site + citation form"
    admin_code:          "administrative regulations (the state's code of regulations)"
    register:            "the state register / bulletin (proposed and final rulemaking, notices)"
    civil_rules:         "rules of civil procedure for the trial courts"
    appellate_rules:     "rules of appellate procedure"
    court_chain:         "trial court -> intermediate appellate court -> court of last resort (names), and small-claims/limited court"
    efiling:             "the state's e-filing system(s) and who may use them"
    consumer_statutes:   "the state consumer-protection / debt-collection / credit statutes (UTPCPL equivalents)"
    financial_regulator: "the licensing regulator for lenders, collectors, insurers (DOBI equivalent) + insurance regulator + AG consumer unit"
    judicial_conduct:    "the body that receives complaints about judges (JCB equivalent)"
    attorney_discipline: "the body that receives complaints about lawyers (ODC equivalent)"
    reporters:           "official case-law reporters / court opinion sites (state supreme + intermediate)"
    filing_fees_ifp:     "fee schedule and the in forma pauperis (fee waiver) rule/form"
    business_registry:   "the state business-entity search (Secretary of State / Dept. of State): exact legal name, entity type, status, registered agent + address, principal office; plus the licensing lookups for lenders/collectors/insurers"

states:
  PA:
    name: Pennsylvania
    status: verified            # this is the running Beezle configuration
    constitution: {name: "Pennsylvania Constitution", source: "https://www.legis.state.pa.us/cfdocs/legis/LI/consCheck.cfm?txtType=HTM&ttl=00", cite: "Pa. Const. art. I, § 11"}
    statutes: {name: "Pennsylvania Consolidated Statutes (Purdon's unofficial; official = legis.state.pa.us)", source: "https://www.legis.state.pa.us/cfdocs/legis/LI/Public/cons_index.cfm", cite: "42 Pa.C.S. § 5524", corpus_family: "pa_cons_stat_t<title>_s<sec>"}
    admin_code: {name: "Pennsylvania Code", source: "https://www.pacodeandbulletin.gov/", cite: "52 Pa. Code § 1.1", corpus_family: "pa_code_t<N>_ch<N>"}
    register: {name: "Pennsylvania Bulletin", source: "https://www.pacodeandbulletin.gov/", cite: "53 Pa.B. 1234", corpus_family: "<vol>_<issue>_<section> (not, rr, cts, prm, dgs, sop)"}
    civil_rules: {name: "Pennsylvania Rules of Civil Procedure", source: "https://www.pacodeandbulletin.gov/Display/pacode?file=/secure/pacode/data/231/partItoc.html", cite: "Pa.R.C.P. 1028(a)(2)", corpus_family: "pa_rcp_*"}
    appellate_rules: {name: "Pennsylvania Rules of Appellate Procedure", source: "https://www.pacodeandbulletin.gov/Display/pacode?file=/secure/pacode/data/210/partItoc.html", cite: "Pa.R.A.P. 1925(b)"}
    court_chain: {trial: "Court of Common Pleas (county); Magisterial District Courts / Philadelphia Municipal Court for small claims", intermediate: "Superior Court (civil) / Commonwealth Court (government parties)", last_resort: "Supreme Court of Pennsylvania"}
    efiling: {name: "Philadelphia FJD e-filing (county); PACFile (appellate)", source: "https://fjdefile.phila.gov ; https://ujsportal.pacourts.us/", recipe: "recipes/pa_fjd_efile.yaml (verified 2026-09-02)"}
