    judicial_conduct: {name: "Judicial Conduct Board of Pennsylvania", source: "https://judicialconductboardofpa.org/", then: "Court of Judicial Discipline"}
    attorney_discipline: {name: "Disciplinary Board of the Supreme Court of Pennsylvania, Office of Disciplinary Counsel", source: "https://www.padisciplinaryboard.org/", rules: "Pa. R.P.C.; Pa. R.D.E."}
    reporters: {supreme: "Pa. / A.3d; opinions at pacourts.us", intermediate: "Pa. Super. / Pa. Cmwlth. (A.3d)"}
