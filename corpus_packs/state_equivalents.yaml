    business_registry: {name: "PA Department of State, Business Entity Search", source: "https://file.dos.pa.gov/search/business", fields: "legal name, entity type, status, registered office / commercial registered office provider (CROP), formation date", licensing: "PA DoBS licensee search (dobs.pa.gov); NMLS Consumer Access (nmlsconsumeraccess.org); PA Insurance Dept. producer search", notes: "PA uses a registered OFFICE (or CROP) rather than a named agent; service on a foreign entity may go through the Secretary of State (15 Pa.C.S. § 412)"}

