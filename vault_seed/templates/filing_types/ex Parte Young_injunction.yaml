when_clauses:
  - description: >
      Use when a state officer is actively enforcing a specific state law 
      or regulation that the plaintiff challenges as unconstitutional under 
      federal law, and the plaintiff seeks injunctive relief (not damages).
  - description: >
      Use when the defendant is a state officer acting in their official 
      capacity — not the state itself. Ex parte Young creates a waiver of 
      sovereign immunity only against the officer personally for enforcement 
      of unconstitutional law.
  - description: >
      Use when the violation is ongoing or imminent — the doctrine does not 
      apply to completed past conduct or damages claims.

