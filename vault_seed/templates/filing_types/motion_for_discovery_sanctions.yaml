id: motion_for_discovery_sanctions
title: Motion for Discovery Sanctions Under FRCP 37
description:
  Motion for sanctions under FRCP 37 for failure to comply with discovery
  requests, discovery orders, or for discovery abuse.
court: any
required_authorities:
  - FRCP 37(a)(5) — Sanctions for failure to confer on discovery
  - FRCP 37(b)(2) — Sanctions for failure to comply with discovery order
  - FRCP 37(c)(2) — Failure to admit — costs and attorney's fees
  - FRCP 37(d) — Failure to provide discovery — sanctions including dismissal
  - FRCP 37(e) — Loss of electronically stored information — sanctions
  - 28 U.S.C. 1927 — Counsel liability for excessive costs
trigger_defects:
  - FATAL/CONSTRUCTION
  - SERIOUS/CONSTRUCTION
  - discovery_abuse
  - discovery_garnishee_abuse
  - failure_to_produce
required_facts:
  - case_id
  - caption
  - defect_total
structure:
  - block: boilerplate/caption_federal
    when: is_federal == true
  - block: boilerplate/caption_state_pa_ccp
    when: is_federal == false
  - block: sections/introduction
  - block: sections/procedural_history
  - block: arguments/fr37_discovery_sanctions
  - block: sections/prayer_for_relief
  - block: sections/conclusion
  - block: boilerplate/signature_block_pro_se
  - block: boilerplate/certificate_of_service
  - block: boilerplate/proposed_order
