id: motion_to_reinstate_appeal_ifp_granted
title: Motion to Reinstate Appeal — IFP Granted at District Court, Fee Demanded by Appellate Clerk
description: |
  Motion under Fed. R. App. P. 3(a) and 3d Cir. L.A.R. 107.2(b) to reinstate
  an appeal dismissed for failure to pay the docketing fee, where the district
  court ALREADY GRANTED in forma pauperis status on the notice of appeal.
  The dismissal rests on a premise contradicted by the record: the clerk
  demanded a fee that IFP status extinguished.
  Distinct from motion_to_reinstate_appeal (brief-not-filed scenario).
  This type fires when the dismissal reason is specifically "failure to pay
  the requisite fee" and IFP was granted at the district court level.
court: federal_appellate
required_authorities:
- Fed. R. App. P. 3(a)
- 3d Cir. L.A.R. 107.2(b)
- 3d Cir. L.A.R. 107.1(a) (fee requirement — waivable by IFP)
- 28 U.S.C. 1915(a) (IFP: district court grants leave to proceed without prepaying fees)
- 28 U.S.C. 1915(b) (prisoner IFP — fee assessment and deduction)
- Fed. R. App. P. 26(b) (enlargement / excusable neglect)
- Poulis v. State Farm Fire & Cas. Co., 747 F.2d 863 (3d Cir. 1984)
trigger_defects:
- dismissal
- FATAL/PROCEDURAL
- FATAL/JURISDICTION
- FATAL/OPERATIVE_TEXT
- SERIOUS/OPERATIVE_TEXT
- FATAL/NO_WORD_ADDED_OR_SUBTRACTED
- SERIOUS/NO_WORD_ADDED_OR_SUBTRACTED
- FATAL/IFP_GRANTED_YET_FEE_DEMANDED
structure:
- block: boilerplate/caption_appellate_3rd_cir
- block: sections/introduction
- block: sections/factual_statement_federal
- block: arguments/reinstatement_grounds
- block: arguments/ifp_extinguishes_fee_requirement
  when: ifp_granted_at_district == true
- block: arguments/no_word_added_or_subtracted
  when: operative_text_violation == true
- block: arguments/operative_text_discipline
  when: operative_text_violation == true
- block: arguments/court_rules_violation
  when: court_rule_violation == true
- block: arguments/procedural_defect
  when: procedural_defect == true
- block: sections/conclusion
- block: boilerplate/signature_block_pro_se
- block: boilerplate/certificate_of_service
