case_applications:
  - case_id: "{{CASE_ID}}"
    caption: Reyes-Pellegrino / FCRA, Judge {{JUDGE}} (EDPA)
    context: >-
      3d Cir. appellate stage — no briefing schedule issued; a prior 3d Cir.
      appeal ({{CASE_ID}}) was dismissed for "failure to file brief" despite the
      brief being timely filed (systemic clerk-error pattern). This motion
      compels the FRAP 31(a) schedule so no deadline can attach to a party
      that was never given one.

