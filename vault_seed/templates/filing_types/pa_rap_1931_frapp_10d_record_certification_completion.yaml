# Pa.R.A.P. 1931 × FRAP 10(d) — Record Certification & Completion Duty
# Created 2026-09-02 by DISCOVER-VEHICLE (kanban t_1630ae63).
# Copied from the closest baseline: pa_r_c_p_236_clerical_error_correction.yaml
# (same ministerial-clerk-duty posture, same block inventory convention).
# Grounding (3 semantic corpus searches, pa_code_t210_ch19 + frb/wright treatise):
#  - Pa.R.A.P. 1931(a)(1): the record on appeal S{{JUDGE}} be transmitted within 60 days
#    after the notice of appeal (pa_code_t210_ch19, score 0.736).
#  - Pa.R.A.P. 1935(a): prothonotary must give WRITTEN notice to the trial court
#    judge of any delinquency in transmission within 10 days after the filing date
#    (pa_code_t210_ch19, score 0.742); 1935(b): report up the administrative chain.
#  - Pa.R.A.P. 1921 Official Note: an appellate court may consider ONLY facts duly
#    certified in the record — Commonwealth v. Young, 456 Pa. 102, 317 A.2d 258
#    (pa_code_t210_ch19, score 0.774).
#  - Federal mirror: FRAP 10(d) completion of record — referenced verbatim in
#    irs_irm_full / irs_irm_tfm (score ~0.80); Wright & Miller treatise (federal
#    practice and procedure) carries the pre-1968 Rule 75 text (clerk certifies
#    and transmits the record; supplemental record where omissions).
#  NOT IN CORPUS (flagged): standalone verbatim FRAP 10(d) rule text as a
