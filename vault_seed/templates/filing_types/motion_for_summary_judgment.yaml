id: motion_for_summary_judgment
title: Motion for Summary Judgment
description: |
  Motion for summary judgment under FRCP 56 arguing no genuine
  dispute of material fact.
court: any
required_authorities:
  - Fed. R. Civ. P. 56(a) (summary judgment standard)
  - Celotex Corp. v. Catrett, 477 U.S. 317 (1986)
  - Anderson v. Liberty Lobby, Inc., 477 U.S. 242 (1986)
  - Pa.R.C.P. 1035.2 (summary judgment)
trigger_defects:
  - FATAL/AUTHORITY
  - SERIOUS/AUTHORITY
  - FATAL/EVIDENCE
  - SERIOUS/EVIDENCE
structure:
  - block: boilerplate/caption_federal
    when: is_federal == true
  - block: boilerplate/caption_state_pa_ccp
    when: is_federal == false
  - block: sections/introduction
  - block: sections/factual_statement_federal
    when: posture != 'post-judgment'
  - block: sections/factual_statement_enforcement
    when: posture == 'post-judgment'
  - block: sections/statement_of_facts
  - block: sections/procedural_history
  - block: sections/standard_of_review
  - block: sections/prayer_for_relief
  - block: sections/conclusion
  - block: boilerplate/signature_block_pro_se
  - block: boilerplate/certificate_of_service
  - block: boilerplate/proposed_order
