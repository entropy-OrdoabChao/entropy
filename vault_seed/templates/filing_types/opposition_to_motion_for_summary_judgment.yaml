id: opposition_to_motion_for_summary_judgment
title: Plaintiff's Opposition to Motion for Summary Judgment (FRCP 56)
description: |
  Opposition brief responding to defendant's motion for summary judgment
  under FRCP 56. Summary judgment is proper only if "there is no genuine
  dispute as to any material fact and the movant is entitled to judgment
  as a matter of law." Fed. R. Civ. P. 56(a). The court must view the
  evidence in the light most favorable to the nonmoving party and draw
  all reasonable inferences in its favor. Anderson v. Liberty Lobby,
  477 U.S. 242, 255 (1986).

court: any

required_authorities:
  - Fed. R. Civ. P. 56(a) — Summary judgment standard
  - Fed. R. Civ. P. 56(c) — Conversion to summary judgment if extrinsic materials considered
  - Fed. R. Civ. P. 12(c) — Judgment on pleadings (same standard)
  - Celotex Corp. v. Catrett, 477 U.S. 317 (1986) — Initial burden on movant
  - Anderson v. Liberty Lobby, Inc., 477 U.S. 242 (1986) — Genuine dispute standard
  - Matsushita Elec. Indus. Co. v. Zenith Radio Corp., 475 U.S. 574 (1986) — Inferences in favor of nonmovant
  - Ashcroft v. Iqbal, 556 U.S. 662 (2009) — Pleading standard
  - Bell Atl. Corp. v. Twombly, 550 U.S. 544 (2007) — Pleading standard
  - Haines v. Kerner, 404 U.S. 519 (1972) — Pro se liberal construction
  - Safeco Ins. Co. v. Burr, 551 U.S. 47 (2007) — FCRA willfulness = reckless disregard
  - McLaughlin v. Richland Shoe Co., 486 U.S. 128 (1988) — Willfulness = knowing/reckless
  - Fed. R. Evid. 201(b)(2) — Judicial notice of court record

trigger_defects:
  - SERIOUS/AUTHORITY
  - FATAL/AUTHORITY
  - SERIOUS/CLAIM_DEFECT
  - FATAL/CLAIM_DEFECT
  - FATAL/JURISDICTION
  - claim_defect
  - summary_judgment
  - motion_for_summary_judgment

structure:
