id: fcras_enforcement_1681n1681o
title: FCRA Enforcement – Willful/Negligent Noncompliance
description: >
  Civil enforcement action under 15 U.S.C. §§1681n (willful noncompliance) and 1681o
  (negligent noncompliance) against any person — CRAs, furnishers, end users — that
  fails to comply with FCRA requirements. Yields actual damages, statutory damages
  ($100–$1,000), punitive damages (willful only), costs, and attorneys' fees.
  
  §1681n provides an explicit right of action against any person — a statutory
  damages floor of $100 to $1,000 per violation, plus punitive damages and fees
  where the violation is WILLFUL. Willfulness includes reckless disregard per
  Safeco Ins. Co. v. Burr, 551 U.S. 47 (2007).
  
  §1681o provides a negligence standard with actual-damages-only and no punitive
  damages; both §§1681n and §1681o(b) provide for costs and attorneys' fees on
  an unsuccessful paper filed in bad faith or harassment.

  This vehicle is used when a CRMA, furnisher, or end user has violated FCRA
  compliance duties (15 U.S.C. §1681 et seq.) — failure to maintain reasonable
  procedures, failure to conduct reasonable investigation, furnishing inaccurate
  information, failure to provide required notices.

  Key provisions:
  - 15 U.S.C. §1681n(a): civil liability for WILLFUL noncompliance (actual damages
    OR statutory $100–$1,000; punitive damages; costs + attorney's fees)
  - 15 U.S.C. §1681n(b): liability for natural persons obtaining reports under
    false pretenses or without permissible purpose
  - 15 U.S.C. §1681o(a): civil liability for NEGLIGENT noncompliance (actual
    damages; costs + attorney's fees; no punitive damages)
  - 15 U.S.C. §1681o(b): attorneys' fees on unsuccessful papers filed in bad faith
    or harassment
  - Safeco Ins. Co. v. Burr, 551 U.S. 47 (2007): "willfulness" includes reckless
    disregard of FCRA requirements

court: fed_district_or_state
required_authorities:
  - citation: "15 U.S.C. §1681n(a)"
    proposition: >
      "Any person who willfully fails to comply with any requirement under this
      subchapter with respect to a consumer is liable to that consumer in an
      amount equal to the sum of: (1) any actual damages sustained by such
      consumer as a result of the failure or liability of $100 to $500, whichever
      is LARGER; (2) such amount of punitive damages as the court may allow; AND
      (3) in the case of any successful action to enforce the foregoing liability,
      the costs of such action together with the costs and attorney's fees."
  - citation: "15 U.S.C. §1681n(b)"
    proposition: >
      "Any person who obtains a consumer report under false pretenses or false
      statements is liable to the consumer reporting agency for actual damages,
      punitive damages, costs, and reasonable attorney's fees."
  - citation: "15 U.S.C. §1681o(a)"
    proposition: >
      "Any person who is negligent in failing to comply with any requirement under
      this subchapter with respect to a consumer is liable to that consumer for
      actual damages sustained by such consumer as a result of the failure."
  - citation: "15 U.S.C. §1681o(b)"
    proposition: >
      "A consumer may recover costs and reasonable attorney's fees for any
      unsuccessful paper filed in bad faith or to harass on an action under this
      subchapter."
  - citation: "Safeco Ins. Co. v. Burr, 551 U.S. 47 (2007)"
    proposition: >
      "Willfulness under §1681n includes reckless disregard of FCRA requirements;
      a plaintiff need not prove intent to violate the FCRA, only reckless
      indifference to statutory obligations."

