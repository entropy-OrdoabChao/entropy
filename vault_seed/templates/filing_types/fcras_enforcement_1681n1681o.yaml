structure:
  - type: caption
    block: boilerplate/caption_federal
  - type: section
    block: sections/introduction
    content: "Identify the FCRA violation — willful (§1681n) or negligent (§1681o) —
      the named defendant committed, the consumer affected, and the specific FCRA
      requirement breached. State jurisdiction and statutory basis."
  - type: section
    block: sections/procedural_history
    content: "Trace the consumer credit file/report history: (1) how and when the
      consumer report was obtained/used; (2) the FCRA duty owed by the defendant
      under §1681 et seq.; (3) the specific compliance failure; (4) any notice
      provided or omitted; (5) downstream harm to the consumer."
  - type: section
    block: sections/factual_statement_enforcement
    content: "Establish the factual predicate for willful or negligent noncompliance.
      For §1681n, demonstrate willfulness (including reckless disregard per Safeco
      v. Burr). For §1681o, demonstrate negligence (failure to maintain reasonable
      procedures). Cite the specific CRA/furnisher/furnisher procedure failure."
  - type: section
    block: sections/definitions_schedule_canons
    content: "Define: 'consumer reporting agency' (§1681a(f)), 'furnisher' (§1681a(m)),
      'consumer report' (§1681a(c)), 'willful' (Safeco v. Burr — reckless disregard),
      'reasonable procedure' (§1681s(m)(2)). Ground definitions in the statute."
  - type: argument
    block: arguments/statutory_violation
    content: "Argue that the defendant's conduct violates a specific FCRA requirement.
      For willful violations (§1681n), argue reckless disregard. For negligent
      violations (§1681o), argue failure to maintain reasonable procedures. Cite
      controlling Third Circuit and Supreme Court authority on FCRA enforcement."
  - type: argument
    block: arguments/damages_calculation
    content: "Calculate damages: (1) actual damages proven; (2) statutory damages
      ($100–$500 per violation under §1681n(a)(1)); (3) punitive damages where
      applicable (willful only under §1681n(a)(2)); (4) costs and attorneys'
      fees on successful enforcement actions."
  - type: argument
    block: arguments/fee_shifting
    content: "Argue for costs and attorneys' fees under §1681n(a)(3) for successful
      actions, or §1681o(b) for bad-faith filings. Note that the fee-shifting
      provision is mandatory for successful enforcement."
  - type: section
    block: sections/conclusion
    content: "Request entry of judgment for actual damages, statutory damages
      where applicable, punitive damages where warranted, costs, and attorneys'
      fees under the FCRA."
  - type: section
    block: sections/prayer_for_relief
    content: "Prayer for: (1) entry of judgment under 15 U.S.C. §1681n(a) or
      §1681o(a); (2) actual damages; (3) statutory damages ($100–$500 per
      violation) where willful noncompliance shown; (4) punitive damages where
      applicable; (5) costs and attorneys' fees; (6) such other relief as
      the court deems just."
  - type: boilerplate
    block: boilerplate/certificate_of_service
  - type: boilerplate
    block: boilerplate/proposed_order
