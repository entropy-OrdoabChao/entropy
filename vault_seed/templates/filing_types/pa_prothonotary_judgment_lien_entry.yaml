required_authorities:
  - citation: "Pa.R.C.P. 3022"
    proposition: "Verdict or order entry creates lien when entered in judgment index — the prothonotary's mandatory duty."
  - citation: "Pa.R.C.P. 3023"
    proposition: "Judgment creates lien when entered in judgment index — same ministerial duty extended to post-verdict judgments."
  - citation: "42 Pa.C.S. § 8101"
    proposition: "Definitions for judgment lien provisions — establishes what constitutes a judgment lien."
  - citation: "42 Pa.C.S. § 8102"
    proposition: "Duration and renewal of judgment liens — 5-year basic period with renewal by re-filing."
  - citation: "42 Pa.C.S. § 8103"
    proposition: "Effect of judgment lien on real property — lien attaches when entered in judgment index."
  - citation: "42 Pa.C.S. § 2704"
    proposition: "Prothonotary responsibility for maintenance of records, judgment index data, and certification."
  - citation: "Pa. Bulletin, Vol. 34, No. 1, January 3, 2004"
    proposition: "Rule 3022 amendments changing lien inception from rendition to judgment index entry."

trigger_defects:
  - prothonotary_failed_to_enter_in_index
  - judgment_lien_not_attached_despite_verdict
  - lien_ inception_delayed_by_prothonotary
  - praecipe_for_entry_ignored
  - prothonotary_refusal_to_record
  - ministry_act_delayed
  - lien_priority_lost_due_to_index_delay

required_facts:
  - case_id
  - caption
  - judgment_or_verdict_date
  - county_of_venue
  - judgment_amount
  - defendant_name — judgment debtor
  - judgment_entry_status — whether prothonotary has entered in index
  - praecipe_filed — whether judgment creditor submitted praecipe for entry
  - prothonotary_response — any response or refusal from the prothonotary's office

