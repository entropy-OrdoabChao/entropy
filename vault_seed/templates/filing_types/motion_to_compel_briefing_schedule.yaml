id: motion_to_compel_briefing_schedule
title: Motion to Compel Briefing Schedule Under FRAP 31(a)/(c)
description: 'Motion under Fed. R. App. P. 31(a) and 31(c) compelling the Clerk of the
  Third Circuit to issue a scheduling order setting the briefing schedule.
  Grounded in the court''s inherent authority to maintain an accurate record
  and FRAP 31''s mandate that the clerk promptly schedule the case for briefing.
  Without a scheduling order, there is no deadline for the appellant to violate.
  This is the predicate motion to the reinstatement sequence: correct the record
  to show no schedule was ever issued, then file the reinstatement motion with
  the corrected record as the factual predicate.

  Key provisions:
  - FRAP 31(a): The clerk shall promptly schedule the case for briefing and oral argument
  - FRAP 31(c): The clerk shall notify all parties of the dates for filing briefs
  - Pro se litigants get liberal construction (Haines v. Kerner, 404 U.S. 519)
  - Poulis v. State Farm Fire & Cas. Co., 747 F.2d 863 (3d Cir. 1984)
    — dismissal for failure to prosecute disfavored absent fault and prejudice
  '
court: federal_appellate
