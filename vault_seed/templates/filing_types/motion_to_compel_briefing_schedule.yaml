- 3d Cir. L.A.R. 107.2(a) — Briefing requirements
- Haines v. Kerner, 404 U.S. 519 (1972) — Pro se liberal construction
- Poulis v. State Farm Fire & Cas. Co., 747 F.2d 863 (3d Cir. 1984)
