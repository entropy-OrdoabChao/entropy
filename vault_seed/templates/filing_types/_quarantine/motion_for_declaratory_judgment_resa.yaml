  - 28 U.S.C. § 2202 — Further relief upon declaratory judgment
  - 12 U.S.C. § 2605(b)(1) — Notice by transferor of loan servicing
  - 12 U.S.C. § 2605(a) — Prohibition on transfer of servicing
  - UCC § 3-203 — Transfer of instrument
  - UCC § 3-302 — Holder in due course

