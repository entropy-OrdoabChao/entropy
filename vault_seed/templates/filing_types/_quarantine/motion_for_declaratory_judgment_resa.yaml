id: motion_for_declaratory_judgment_resa
title: Motion for Declaratory Judgment — Loan Status Under RESA and UCC Articles 3/4
description: |
  Motion for declaratory judgment on the legal status of a loan that was pooled and sold as collateral without proper notice under RESA and UCC Articles 3/4.

Under RESA, when a loan is transferred without proper notice, the borrower has standing to seek a declaration that the loan remains a "federally related mortgage loan" under RESA and that the servicing transfer was ineffective.

Under UCC Article 3, when a loan is pooled without proper notice, the borrower has standing to seek a declaration that the transferee is not a holder in due course.

This motion targets cases where:
- GNMA REMIC trust files exist indicating the loan was pooled as collateral
- The borrower has been denied proper notice under RESA
- The loan's legal status is uncertain due to the pooling
- The borrower needs a declaration to assert defenses to foreclosure

court: any
required_authorities:
