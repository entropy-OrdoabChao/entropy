id: motion_for_unjust_enrichment
title: Motion for Unjust Enrichment — Servicer Retains Proceeds of Collateralized Loan Without Proper Notice
description: |
  Motion for unjust enrichment against a servicer that retains proceeds from a loan that was pooled and sold as collateral without proper notice.

When a loan is pooled into a GNMA REMIC trust without proper notice to the borrower under RESA, the servicer has been unjustly enriched by retaining proceeds that belong to the beneficial owners of the trust. The elements are:
1. Defendant received a benefit
2. Defendant's retention of the benefit is unjust

The benefit is the proceeds of the loan that was pooled without notice. The injustice is that the servicer retained the proceeds while the beneficial owners of the trust were not compensated.

This motion targets cases where:
- GNMA REMIC trust files exist indicating the loan was pooled as collateral
- 1099-C returns exist indicating cancellation of debt
- The servicer retained proceeds from the loan after it was pooled
- The borrower was never provided with notice of the pooling

