id: motion_for_accounting
title: Motion for Trust Accounting — GNMA REMIC Trust Collateralized by Borrower's Loan Without Proper Disclosure
description: |
  Motion for an accounting of the GNMA REMIC trust and the borrower's loan within the trust.

Under the federal lending statutes and the terms of GNMA REMIC trusts, the borrower has a right to know the status of their loan within the securitization. When the loan is pooled as collateral without proper notice, the borrower is entitled to an accounting of:
- The pool in which the loan was placed
- The trust's allocation of the loan's cash flows
- The identity of the beneficial owner
- The status of the loan's collateralization

This motion targets cases where:
- GNMA REMIC trust files exist (FDS, RLY, ANC, SRF, FRR, MTF)
- The loan appears in the trust's collateral pool
- The borrower was never provided with notice of the trust's existence
- The borrower has standing to demand an accounting under RESA and the trust terms

