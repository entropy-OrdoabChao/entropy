id: motion_for_resa_violation
title: Motion for RESA Violation — Notice of Servicing Transfer Under 12 U.S.C. § 2605(b)
description: |
  Motion under RESA (12 U.S.C. §§ 2601-2625) for violation of the notice requirement for servicing transfer.

Under 12 U.S.C. § 2605(b)(1), a transferor of servicing of a federally related mortgage loan shall provide written notice to the borrower not later than 30 days before the effective date of the transfer. The notice must include:
- Name, address, and telephone number of the transferee
- Name, address, and telephone number of the person to contact regarding servicing
- Effective date of the transfer
- Information about escrow accounts

Under 12 U.S.C. § 2605(b)(2), the transferee must provide written notice to the borrower not later than 60 days after the effective date of the transfer, including:
- Name and address of the transferee
- Effective date of the transfer
- Information about escrow accounts

When the notice is not provided, the borrower may assert the violation as a defense to foreclosure and as evidence of fraud on the court — the servicer concealed the true identity and capacity of the party holding the note.

This motion targets cases where:
- GNMA REMIC trust files exist indicating the loan was pooled as collateral (evidencing a prior servicing transfer without notice)
- 1099-C returns exist indicating cancellation of debt without proper notice
- The servicer changed without proper § 2605(b) notice
- The loan was securitized without proper disclosure of the servicing transfer

court: any
